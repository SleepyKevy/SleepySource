name: Apply SleepySource 1.0.0 to main

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-1.0.0-main.yml'

permissions:
  contents: write

jobs:
  apply-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and validate SleepySource 1.0.0
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_BASE_TREE="eedbe51a11271db173a7a20dcd0cc6a4a9fd97d2"
          EXPECTED_TARGET_TREE="407573dc087ce8978e99c07090730317ddd43a46"
          TEMP_WORKFLOW=".github/workflows/apply-1.0.0-main.yml"
          STAGING_BRANCH="agent/sleepysource-1.0.0"

          PARENT_TREE="$(git rev-parse 'HEAD^^{tree}')"
          if [ "$PARENT_TREE" != "$EXPECTED_BASE_TREE" ]; then
            echo "Refusing to apply: parent main tree changed. Expected $EXPECTED_BASE_TREE, got $PARENT_TREE"
            exit 1
          fi

          CHANGED_FROM_PARENT="$(git diff --name-only HEAD^ HEAD)"
          if [ "$CHANGED_FROM_PARENT" != "$TEMP_WORKFLOW" ]; then
            echo "Refusing to apply: temporary trigger commit changed unexpected paths:"
            echo "$CHANGED_FROM_PARENT"
            exit 1
          fi

          git fetch origin "$STAGING_BRANCH":refs/remotes/origin/$STAGING_BRANCH
          : > /tmp/sleepysource-delta.b64
          for n in 00 01 02 03 04 05 06 07 08 09; do
            git show "origin/$STAGING_BRANCH:.release_payload_v3/part_$n" >> /tmp/sleepysource-delta.b64
          done
          base64 -d /tmp/sleepysource-delta.b64 | xz -d > /tmp/sleepysource-delta.json

          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path('.')
          with open('/tmp/sleepysource-delta.json', 'r', encoding='utf-8') as handle:
              delta = json.load(handle)

          token_re = re.compile(rb'\w+|\s+|[^\w\s]+')

          for rel in delta['delete']:
              path = root / rel
              if path.exists():
                  path.unlink()

          for rel, spec in delta['files'].items():
              path = root / rel
              if spec['old'] is None:
                  old = b''
              else:
                  if not path.is_file():
                      raise SystemExit(f'Missing expected baseline file: {rel}')
                  old = path.read_bytes()
                  actual_old = hashlib.sha256(old).hexdigest()
                  if actual_old != spec['old']:
                      raise SystemExit(
                          f'Baseline SHA-256 mismatch for {rel}: expected {spec["old"]}, got {actual_old}'
                      )

              tokens = token_re.findall(old)
              output = bytearray()
              for op in spec['ops']:
                  if op[0] == 'c':
                      output.extend(b''.join(tokens[op[1]:op[2]]))
                  elif op[0] == 'd':
                      output.extend(base64.b64decode(op[1]))
                  else:
                      raise SystemExit(f'Unknown delta operation {op[0]!r} in {rel}')

              actual_new = hashlib.sha256(output).hexdigest()
              if actual_new != spec['new']:
                  raise SystemExit(
                      f'Target SHA-256 mismatch for {rel}: expected {spec["new"]}, got {actual_new}'
                  )

              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(output)

          print(f'Applied and verified {len(delta["files"])} changed/new files and {len(delta["delete"])} deletions.')
          PY

          rm -f "$TEMP_WORKFLOW"

          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path('.')
          branding = re.compile(
              r'(SleepySource[ _-]*1\.1|Auth Build|Build 1\.1|v1\.1)',
              re.IGNORECASE,
          )
          hits = []
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if branding.search(text):
                  hits.append(str(path))

          if hits:
              raise SystemExit('Forbidden 1.1/Auth Build branding remains in: ' + ', '.join(hits))
          print('1.1/Auth Build branding scan: clean.')
          PY

          git add -A
          TARGET_TREE="$(git write-tree)"
          if [ "$TARGET_TREE" != "$EXPECTED_TARGET_TREE" ]; then
            echo "Refusing to push: target tree mismatch. Expected $EXPECTED_TARGET_TREE, got $TARGET_TREE"
            exit 1
          fi

          git config user.name "SleepySource Release Bot"
          git config user.email "316921689+SleepyKevy@users.noreply.github.com"
          git commit -m "Release SleepySource 1.0.0"
          git push origin HEAD:main

          echo "SleepySource 1.0.0 pushed to main with exact tree $TARGET_TREE"
