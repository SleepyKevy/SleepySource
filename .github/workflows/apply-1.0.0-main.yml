name: Apply SleepySource 1.0.0 to main

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-1.0.0-main.yml'

permissions:
  contents: write

jobs:
  apply-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified SleepySource 1.0.0 tree
        shell: bash
        run: |
          set -euo pipefail

          BASE_COMMIT="0133d7ec24ccbab0e94e83c981d1d660db2c7ddb"
          EXPECTED_BASE_TREE="eedbe51a11271db173a7a20dcd0cc6a4a9fd97d2"
          EXPECTED_TARGET_TREE="407573dc3e1c237806ccd4a616ebd283dee99ef3"
          EXPECTED_PATCH_SHA256="526262217ec2dc6dff5e18d8a74e7f17abf36beb03aac18ba23b268085b9d89d"
          TEMP_WORKFLOW=".github/workflows/apply-1.0.0-main.yml"
          STAGING_BRANCH="agent/sleepysource-1.0.0-final"
          PAYLOAD_PATH=".release_payload_single/patch.bin"

          ACTUAL_BASE_TREE="$(git rev-parse "${BASE_COMMIT}^{tree}")"
          if [ "$ACTUAL_BASE_TREE" != "$EXPECTED_BASE_TREE" ]; then
            echo "Refusing to apply: audited source commit does not match the expected tree."
            echo "Expected $EXPECTED_BASE_TREE"
            echo "Got      $ACTUAL_BASE_TREE"
            exit 1
          fi

          CHANGED_SINCE_BASE="$(git diff --name-only "$BASE_COMMIT"..HEAD | sort -u)"
          if [ "$CHANGED_SINCE_BASE" != "$TEMP_WORKFLOW" ]; then
            echo "Refusing to apply: unexpected files changed since the audited source commit:"
            echo "$CHANGED_SINCE_BASE"
            exit 1
          fi

          git fetch origin "$STAGING_BRANCH":refs/remotes/origin/$STAGING_BRANCH
          git show "origin/$STAGING_BRANCH:$PAYLOAD_PATH" > /tmp/sleepysource-1.0.0.patch.gz.b64

          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path

          encoded = b''.join(Path('/tmp/sleepysource-1.0.0.patch.gz.b64').read_bytes().split())
          try:
              compressed = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit(f'Payload Base64 validation failed: {exc}')

          try:
              patch = gzip.decompress(compressed)
          except Exception as exc:
              raise SystemExit(f'Payload gzip validation failed: {exc}')

          actual_patch_sha = hashlib.sha256(patch).hexdigest()
          expected_patch_sha = '526262217ec2dc6dff5e18d8a74e7f17abf36beb03aac18ba23b268085b9d89d'
          if actual_patch_sha != expected_patch_sha:
              raise SystemExit(
                  f'Patch SHA-256 mismatch: expected {expected_patch_sha}, got {actual_patch_sha}'
              )

          Path('/tmp/sleepysource-1.0.0.patch').write_bytes(patch)
          print('Payload decoded and SHA-256 verified successfully.')
          PY

          # Restore the exact audited source tree in the index/worktree while
          # keeping the current HEAD so the final push remains fast-forward.
          git read-tree --reset -u "$BASE_COMMIT"
          git clean -fdx

          git apply --check /tmp/sleepysource-1.0.0.patch
          git apply /tmp/sleepysource-1.0.0.patch

          python3 - <<'PY'
          import re
          from pathlib import Path

          forbidden = re.compile(
              r'(SleepySource[ _-]*1\.1|Auth Build|Build 1\.1|v1\.1)',
              re.IGNORECASE,
          )
          hits = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if forbidden.search(text):
                  hits.append(str(path))

          if hits:
              raise SystemExit('Forbidden old branding remains in: ' + ', '.join(hits))
          print('Old branding scan: clean.')
          PY

          git add -A
          TARGET_TREE="$(git write-tree)"
          echo "Computed target tree: $TARGET_TREE"
          if [ "$TARGET_TREE" != "$EXPECTED_TARGET_TREE" ]; then
            echo "Refusing to push: exact target tree mismatch."
            echo "Expected $EXPECTED_TARGET_TREE"
            echo "Got      $TARGET_TREE"
            exit 1
          fi

          git config user.name "SleepySource Release Bot"
          git config user.email "316921689+SleepyKevy@users.noreply.github.com"
          git commit -m "Release SleepySource 1.0.0"
          git push origin HEAD:main

          echo "SleepySource 1.0.0 pushed successfully with exact tree $TARGET_TREE"
