name: Apply C# Contract Parity Fixes

on:
  push:
    branches:
      - csharp-rewrite-1.0
    paths:
      - .rewrite/APPLY_CONTRACT_FIXES

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: csharp-rewrite-1.0
          fetch-depth: 0

      - name: Apply exact Go contract compatibility fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Replace-Exact([string]$path, [string]$old, [string]$new, [int]$expected = 1) {
            $text = Get-Content $path -Raw
            $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
            if ($count -ne $expected) { throw "$path expected $expected occurrence(s) but found $count for: $old" }
            $text = $text.Replace($old, $new)
            [IO.File]::WriteAllText((Resolve-Path $path), $text, [Text.UTF8Encoding]::new($false))
          }

          # Countdown GET contracts return the same full state as the Go engine.
          Replace-Exact 'CSharpHost/BackendHost.cs' `
            'web.MapGet("/api/countdown/settings",()=>J(countdown.State().Settings));' `
            'web.MapMethods("/api/countdown/settings",["GET","HEAD"],()=>J(countdown.State(core.ListFonts())));'
          Replace-Exact 'CSharpHost/BackendHost.cs' `
            'web.MapGet("/api/countdown/profiles",()=>J(countdown.ListProfiles()));' `
            'web.MapMethods("/api/countdown/profiles",["GET","HEAD"],()=>J(countdown.State(core.ListFonts())));'

          # Alert Studio consumes only for consumer=overlay, and defaults=1/true mirrors Go.
          Replace-Exact 'CSharpHost/BackendHost.cs' `
            'web.MapMethods("/api/alerts/state",["GET","HEAD"],(HttpRequest r)=>J(alerts.State(r.Query["consume"].ToString()!="0")));' `
            'web.MapMethods("/api/alerts/state",["GET","HEAD"],(HttpRequest r)=>J(alerts.State(string.Equals(r.Query["consumer"].ToString(),"overlay",StringComparison.OrdinalIgnoreCase))));'
          Replace-Exact 'CSharpHost/BackendHost.cs' `
            'web.MapGet("/api/alerts/settings",()=>J(alerts.SettingsSnapshot()));' `
            'web.MapMethods("/api/alerts/settings",["GET","HEAD"],(HttpRequest r)=>{var d=r.Query["defaults"].ToString().Trim();return J(d=="1"||d.Equals("true",StringComparison.OrdinalIgnoreCase)?AlertService.DefaultSettings():alerts.SettingsSnapshot());});'

          # HTTP chat state uses Go-style omitempty while internal service state remains strongly typed.
          Replace-Exact 'CSharpHost/BackendHost.cs' `
            'web.MapMethods("/api/chat/state",["GET","HEAD"],()=>J(chat.State()));' `
            'web.MapMethods("/api/chat/state",["GET","HEAD"],()=>J(ResponsePayloads.Chat(chat.State())));'
          Replace-Exact 'CSharpHost/BackendHost.cs' `
            'return J(chat.State());});' `
            'return J(ResponsePayloads.Chat(chat.State()));});'

          # Empty countdown profile/font slices are omitted like Go omitempty.
          Replace-Exact 'CSharpHost/CountdownService.cs' `
            'Fonts = fonts, Profiles = ListProfiles()' `
            'Fonts = fonts is { Count: > 0 } ? fonts : null, Profiles = ListProfiles() is { Count: > 0 } profiles ? profiles : null'

          # Go serializes a nil empty alert queue as null.
          Replace-Exact 'CSharpHost/AlertService.cs' `
            'Settings = Clone(settings), Current = current == null ? null : Clone(current), Queue = queue.Select(Clone).ToList(), QueueDepth = queue.Count,' `
            'Settings = Clone(settings), Current = current == null ? null : Clone(current), Queue = queue.Count == 0 ? null! : queue.Select(Clone).ToList(), QueueDepth = queue.Count,'

          # Empty alert media paths are omitted by Go's json omitempty.
          Replace-Exact 'CSharpHost/Models.cs' `
            '[JsonIgnore(Condition = JsonIgnoreCondition.WhenWritingDefault)] public string VisualFile { get; set; } = "";' `
            '[JsonIgnore(Condition = JsonIgnoreCondition.WhenWritingDefault)] public string VisualFile { get; set; } = null!;'
          Replace-Exact 'CSharpHost/Models.cs' `
            '[JsonIgnore(Condition = JsonIgnoreCondition.WhenWritingDefault)] public string SoundFile { get; set; } = "";' `
            '[JsonIgnore(Condition = JsonIgnoreCondition.WhenWritingDefault)] public string SoundFile { get; set; } = null!;'
          Replace-Exact 'CSharpHost/AlertService.cs' `
            's.VisualFile = Path.GetFileName((s.VisualFile ?? "").Trim()); s.SoundFile = Path.GetFileName((s.SoundFile ?? "").Trim());' `
            's.VisualFile = string.IsNullOrWhiteSpace(s.VisualFile) ? null! : Path.GetFileName(s.VisualFile.Trim()); s.SoundFile = string.IsNullOrWhiteSpace(s.SoundFile) ? null! : Path.GetFileName(s.SoundFile.Trim());'

          # Cloudflare optional fields are emitted only when populated, matching Go.
          Replace-Exact 'CSharpHost/CloudflareService.cs' `
            'public object State(){lock(gate){var ready=File.Exists(runtime)&&new FileInfo(runtime).Length is >0 and <=MaxBytes;return new{running,started_at=startedAt,last_error=lastError,public_url=publicURL,webhook_url=publicURL.Length>0?publicURL.TrimEnd(''/'')+"/api/chat/kick-webhook":"",binary=runtime,integrated=true,runtime_ready=ready,runtime_version=Version,mode="quick",needs_kick_setup=true};}}' `
            'public object State(){lock(gate){var ready=File.Exists(runtime)&&new FileInfo(runtime).Length is >0 and <=MaxBytes;return ResponsePayloads.Cloudflare(running,startedAt,lastError,publicURL,runtime,ready,Version);}}'

      - name: Commit compatibility fixes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CSharpHost
          git commit -m 'Match Go API contracts in pure C# backend'
          git push origin HEAD:csharp-rewrite-1.0
