name: Apply SleepySource 1.1 release delta

on:
  push:
    branches:
      - agent/sleepysource-1.1-release
    paths:
      - .release-upload/RUN

permissions:
  contents: write

jobs:
  apply-delta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and apply release files
        shell: bash
        run: |
          set -euo pipefail
          cat .release-upload/chunk-* > /tmp/sleepysource-release.b64
          base64 --decode /tmp/sleepysource-release.b64 > /tmp/sleepysource-release.zip
          mkdir -p /tmp/sleepysource-release
          unzip -q -o /tmp/sleepysource-release.zip -d /tmp/sleepysource-release
          cp -a /tmp/sleepysource-release/. .
          rm -rf .release-upload

      - name: Commit reconstructed 1.1 release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No delta changes to commit."
            exit 0
          fi
          git commit -m "Apply SleepySource 1.1 release candidate"
          git push origin HEAD:agent/sleepysource-1.1-release
