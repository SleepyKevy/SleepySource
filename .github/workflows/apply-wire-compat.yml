name: Apply SleepySource CSharp Wire Compatibility

on:
  push:
    branches:
      - csharp-rewrite-1.0
    paths:
      - .github/workflows/apply-wire-compat.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: csharp-rewrite-1.0
          fetch-depth: 0

      - name: Apply verified route compatibility patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'CSharpHost/BackendHost.cs'
          $script:content = Get-Content $path -Raw

          function Replace-Exact([string]$old, [string]$new, [int]$expected) {
            $count = ([regex]::Matches($script:content, [regex]::Escape($old))).Count
            if ($count -ne $expected) { throw "Expected $expected occurrences but found $count for: $old" }
            $script:content = $script:content.Replace($old, $new)
          }

          Replace-Exact 'web.MapMethods("/api/countdown/state",["GET","HEAD"],()=>J(countdown.State(core.ListFonts())));' 'web.MapMethods("/api/countdown/state",["GET","HEAD"],()=>J(WireCompat.CountdownState(countdown.State(core.ListFonts()))));' 1
          Replace-Exact 'web.MapGet("/api/countdown/settings",()=>J(countdown.State().Settings));' 'web.MapGet("/api/countdown/settings",()=>J(WireCompat.CountdownState(countdown.State(core.ListFonts()))));' 1
          Replace-Exact 'return J(countdown.State(core.ListFonts()));' 'return J(WireCompat.CountdownState(countdown.State(core.ListFonts())));' 3
          Replace-Exact 'web.MapGet("/api/countdown/profiles",()=>J(countdown.ListProfiles()));' 'web.MapGet("/api/countdown/profiles",()=>J(WireCompat.CountdownState(countdown.State(core.ListFonts()))));' 1
          Replace-Exact 'return J(new{settings=countdown.State().Settings,fonts=core.ListFonts()});' 'return J(WireCompat.CountdownState(countdown.State(core.ListFonts())));' 1

          Replace-Exact 'web.MapMethods("/api/alerts/state",["GET","HEAD"],(HttpRequest r)=>J(alerts.State(r.Query["consume"].ToString()!="0")));' 'web.MapMethods("/api/alerts/state",["GET","HEAD"],(HttpRequest r)=>J(WireCompat.AlertState(alerts.State(r.Query["consume"].ToString()!="0"))));' 1
          Replace-Exact 'J(alerts.SettingsSnapshot())' 'J(WireCompat.AlertSettings(alerts.SettingsSnapshot()))' 2
          Replace-Exact 'J(alerts.State(false))' 'J(WireCompat.AlertState(alerts.State(false)))' 4

          Replace-Exact 'J(chat.State())' 'J(WireCompat.ChatState(chat.State()))' 2
          Replace-Exact 'J(cloudflare.State())' 'J(WireCompat.Cloudflare(cloudflare.State()))' 3

          [IO.File]::WriteAllText((Resolve-Path $path), $script:content, [Text.UTF8Encoding]::new($false))
          git diff --check
          git diff -- $path

      - name: Commit compatibility patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CSharpHost/BackendHost.cs
          if (git diff --cached --quiet) { throw 'Compatibility patch produced no source changes.' }
          git commit -m 'Match C# API response contracts to Go baseline'
          git push origin HEAD:csharp-rewrite-1.0
