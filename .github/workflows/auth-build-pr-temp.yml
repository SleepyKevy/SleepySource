name: SleepySource Auth Build Observable Compile

on:
  pull_request:
    branches:
      - auth-build-compile-temp

permissions:
  contents: read

jobs:
  build-auth:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply exact Auth Build patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @(Get-ChildItem '.authbuild/diff_*.b64' | Sort-Object Name)
          if ($parts.Count -ne 5) { throw "Expected 5 patch chunks, found $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('auth_git.patch.xz', [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash 'auth_git.patch.xz' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '762d93ffa8bc0d028e1a5b6cb441a06883fccd8c717557a073b8f262fd2b1f93') { throw "Patch hash mismatch: $hash" }
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          & $sevenZip x -y 'auth_git.patch.xz'
          if ($LASTEXITCODE -ne 0) { throw 'Patch decompression failed.' }
          git apply --binary --whitespace=nowarn auth_git.patch
          if ($LASTEXITCODE -ne 0) { throw 'Exact Auth Build patch failed to apply.' }

      - name: Verify exact source manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($line in Get-Content '.authbuild/expected_manifest.txt') {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Bad manifest line: $line" }
            $expected = $Matches[1]
            $filePath = $Matches[2]
            if (-not (Test-Path -LiteralPath $filePath)) { throw "Missing: $filePath" }
            $actual = (Get-FileHash -LiteralPath $filePath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Hash mismatch: $filePath" }
          }
          if (Test-Path 'CSharpHost/CloudflareService.cs') { throw 'Legacy Cloudflare service present.' }
          if (Test-Path 'CSharpHost/KickService.cs') { throw 'Legacy Kick service present.' }
          if (-not (Test-Path 'CSharpHost/SleepySourceApiService.cs')) { throw 'Hosted Auth API service missing.' }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish win-x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore CSharpHost/SleepySource.csproj -r win-x64
          dotnet publish CSharpHost/SleepySource.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true --no-restore -o auth-dist
          if (-not (Test-Path 'auth-dist/SleepySource.exe')) { throw 'SleepySource.exe missing.' }
          if (Test-Path 'auth-dist/SleepySource.Engine.exe') { throw 'Legacy engine present.' }
          if (-not (Test-Path 'auth-dist/assets/app.ico')) { throw 'App icon missing.' }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path 'auth-dist/SleepySource.exe').Path)
          if ($null -eq $icon) { throw 'EXE has no embedded icon.' }
          $icon.Dispose()

      - name: Runtime smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'http://127.0.0.1:17891'
          $proc = Start-Process -FilePath (Resolve-Path 'auth-dist/SleepySource.exe') -ArgumentList '--headless' -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              if ($proc.HasExited) { throw "EXE exited early: $($proc.ExitCode)" }
              try {
                $r = Invoke-WebRequest "$base/api/health" -TimeoutSec 2 -UseBasicParsing
                if ($r.StatusCode -eq 200 -and $r.Content.Trim() -eq 'ok') { $ready = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'Local backend failed readiness.' }
            foreach ($route in @('/', '/designer', '/chat', '/overlay', '/countdown', '/alerts')) {
              $r = Invoke-WebRequest ($base + $route) -TimeoutSec 5 -UseBasicParsing
              if ($r.StatusCode -ne 200 -or $r.Content -notmatch '<!doctype html>') { throw "Page failed: $route" }
            }
            foreach ($route in @('/api/state','/api/settings','/api/countdown/state','/api/alerts/state?consume=0','/api/chat/state','/api/kick/status')) {
              $r = Invoke-WebRequest ($base + $route) -TimeoutSec 5 -UseBasicParsing
              if ($r.StatusCode -ne 200) { throw "API failed: $route" }
              $null = $r.Content | ConvertFrom-Json
            }
            $body = @{ username='SmokeTester'; text='Auth Build smoke test'; user_id='12345' } | ConvertTo-Json
            $r = Invoke-WebRequest "$base/api/chat/test" -Method Post -ContentType 'application/json' -Body $body -TimeoutSec 5 -UseBasicParsing
            if ($r.StatusCode -ne 200 -or $r.Content -notmatch 'SmokeTester') { throw 'Chat smoke failed.' }
            $body = @{ type='follow'; username='SmokeFollower' } | ConvertTo-Json
            $r = Invoke-WebRequest "$base/api/alerts/test" -Method Post -ContentType 'application/json' -Body $body -TimeoutSec 5 -UseBasicParsing
            if ($r.StatusCode -ne 200) { throw 'Alert smoke failed.' }
          }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload verified Windows package
        uses: actions/upload-artifact@v4
        with:
          name: SleepySource-1.1-Auth-Build-Windows
          path: auth-dist/
          if-no-files-found: error
