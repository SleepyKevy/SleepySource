name: SleepySource 1.0 Go to C# Contract Parity

on:
  push:
    branches:
      - csharp-rewrite-1.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: windows-latest
    steps:
      - name: Checkout rewrite and baseline
        uses: actions/checkout@v4
        with:
          ref: csharp-rewrite-1.0

      - name: Use .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Use Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Verify UI and asset bytes are unchanged
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Compare-Tree([string]$left, [string]$right) {
            $l = Get-ChildItem $left -File -Recurse | ForEach-Object {
              [pscustomobject]@{ Rel = $_.FullName.Substring((Resolve-Path $left).Path.Length).TrimStart('\'); Hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash }
            }
            $r = Get-ChildItem $right -File -Recurse | ForEach-Object {
              [pscustomobject]@{ Rel = $_.FullName.Substring((Resolve-Path $right).Path.Length).TrimStart('\'); Hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash }
            }
            $ld = @{}; foreach ($x in $l) { $ld[$x.Rel] = $x.Hash }
            $rd = @{}; foreach ($x in $r) { $rd[$x.Rel] = $x.Hash }
            $all = @($ld.Keys + $rd.Keys | Sort-Object -Unique)
            $bad = @()
            foreach ($rel in $all) { if ($ld[$rel] -ne $rd[$rel]) { $bad += $rel } }
            if ($bad.Count) { throw "Tree mismatch between $left and ${right}: $($bad -join ', ')" }
          }
          Compare-Tree 'CompatibilityEngine/web' 'CSharpHost/web'
          Compare-Tree 'CompatibilityEngine/assets' 'CSharpHost/assets'
          Write-Host 'UI and asset trees are byte-identical.'

      - name: Verify HTTP route surface parity
        shell: pwsh
        run: |
          @'
          import re, pathlib, sys
          root = pathlib.Path('.')
          go_routes=set()
          for p in (root/'CompatibilityEngine').glob('*.go'):
              t=p.read_text(encoding='utf-8', errors='ignore')
              go_routes.update(m.group(1) for m in re.finditer(r'\.(?:HandleFunc|Handle)\(\s*"(/[^"]*)"', t))
          cs=(root/'CSharpHost'/'BackendHost.cs').read_text(encoding='utf-8', errors='ignore')
          cs_routes=set(m.group(1) for m in re.finditer(r'\.Map(?:Get|Post|Put|Delete|Methods)\(\s*"(/[^"]*)"',cs))
          cs_routes.update(m.group(1) for m in re.finditer(r'MapPage\(web,\s*"(/[^"]*)"',cs))
          if '/assets/{**name}' in cs_routes:
              cs_routes.remove('/assets/{**name}'); cs_routes.add('/assets/')
          missing=sorted(go_routes-cs_routes); extra=sorted(cs_routes-go_routes)
          print('Go route count:',len(go_routes)); print('C# route count:',len(cs_routes))
          if missing or extra:
              print('Missing in C#:', missing); print('Extra in C#:', extra); sys.exit(1)
          print('Route surface is identical.')
          '@ | python -

      - name: Build Go reference engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item go-reference -ItemType Directory -Force | Out-Null
          Push-Location CompatibilityEngine
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go reference tests failed.' }
          go build -o ../go-reference/SleepySource.Engine.exe .
          if ($LASTEXITCODE -ne 0) { throw 'Go reference build failed.' }
          Pop-Location
          Copy-Item CompatibilityEngine/web go-reference/web -Recurse
          Copy-Item CompatibilityEngine/assets go-reference/assets -Recurse

      - name: Build pure C# backend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore CSharpHost/SleepySource.csproj -r win-x64
          dotnet publish CSharpHost/SleepySource.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true --no-restore -o csharp-reference
          if (-not (Test-Path csharp-reference/SleepySource.exe)) { throw 'Pure C# executable missing.' }
          if (Test-Path csharp-reference/SleepySource.Engine.exe) { throw 'Legacy Go engine leaked into C# output.' }

      - name: Capture Go and C# default contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'http://127.0.0.1:17891'
          $routes = @(
            '/api/state',
            '/api/settings',
            '/api/countdown/state',
            '/api/countdown/settings',
            '/api/countdown/profiles',
            '/api/alerts/state?consume=0',
            '/api/alerts/settings',
            '/api/chat/state',
            '/api/chat/settings',
            '/api/profiles',
            '/api/cloudflare/status',
            '/api/stream/auth/status'
          )
          function Wait-Ready($proc) {
            for ($i=0; $i -lt 40; $i++) {
              if ($proc.HasExited) { throw "Backend exited early with code $($proc.ExitCode)." }
              try { $r=Invoke-WebRequest "$base/api/health" -TimeoutSec 2 -UseBasicParsing; if ($r.StatusCode -eq 200) { return } } catch { }
              Start-Sleep -Milliseconds 500
            }
            throw 'Backend did not become ready.'
          }
          function Capture([string]$name,[string]$exe,[string]$arg) {
            New-Item "contracts/$name" -ItemType Directory -Force | Out-Null
            $p = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList $arg -PassThru
            try {
              Wait-Ready $p
              for ($i=0; $i -lt $routes.Count; $i++) {
                $r = Invoke-WebRequest ($base + $routes[$i]) -TimeoutSec 5 -UseBasicParsing
                if ($r.StatusCode -ne 200) { throw "$name $($routes[$i]) returned $($r.StatusCode)" }
                Set-Content -Path ("contracts/$name/{0:D2}.json" -f $i) -Value $r.Content -Encoding utf8NoBOM
              }
            } finally {
              if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
              Start-Sleep -Seconds 1
            }
          }
          New-Item contracts -ItemType Directory -Force | Out-Null
          Capture 'go' 'go-reference/SleepySource.Engine.exe' '--engine-only'
          Capture 'csharp' 'csharp-reference/SleepySource.exe' '--headless'

      - name: Compare JSON contract shapes
        shell: pwsh
        run: |
          @'
          import json, pathlib, sys
          def shape(v):
              if isinstance(v,dict): return {k:shape(v[k]) for k in sorted(v)}
              if isinstance(v,list): return [shape(v[0])] if v else []
              if v is None: return 'null'
              if isinstance(v,bool): return 'bool'
              if isinstance(v,(int,float)): return 'number'
              return 'string'
          bad=[]
          for gp in sorted(pathlib.Path('contracts/go').glob('*.json')):
              cp=pathlib.Path('contracts/csharp')/gp.name
              try:
                  g=shape(json.loads(gp.read_text(encoding='utf-8-sig')))
                  c=shape(json.loads(cp.read_text(encoding='utf-8-sig')))
              except Exception as e:
                  bad.append((gp.name,'parse',str(e))); continue
              if g!=c: bad.append((gp.name,g,c))
          if bad:
              for x in bad: print('CONTRACT MISMATCH:',x)
              sys.exit(1)
          print('Default JSON contract shapes match across all captured endpoints.')
          '@ | python -

      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SleepySource-1.0-Go-CSharp-Contract-Parity
          path: contracts/
          if-no-files-found: ignore
