name: SleepySource 1.0 Pure C# Gate

on:
  push:
    branches:
      - csharp-rewrite-1.0
    paths:
      - '.rewrite/READY'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout rewrite branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild pure C# source tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem .rewrite/codepart-* | Sort-Object Name
          if ($parts.Count -ne 7) { throw "Expected 7 code bundle parts, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $archive = Join-Path $env:RUNNER_TEMP 'csharp-code.tar.xz'
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'bf95e62313bc508e116bed2490f389820214fe0dd62c7f5aee579c4ec0a13d33') {
            throw "C# source bundle checksum mismatch: $hash"
          }
          if (Test-Path CSharpHost) { Remove-Item CSharpHost -Recurse -Force }
          New-Item CSharpHost -ItemType Directory | Out-Null
          tar -xJf $archive -C CSharpHost
          Copy-Item CompatibilityEngine/web CSharpHost/web -Recurse
          Copy-Item CompatibilityEngine/assets CSharpHost/assets -Recurse
          if (Test-Path CSharpHost/EngineProcessManager.cs) { throw 'Legacy engine manager unexpectedly present' }

      - name: Restore .NET 8 project
        run: dotnet restore CSharpHost/SleepySource.csproj

      - name: Build pure C# host
        run: dotnet build CSharpHost/SleepySource.csproj -c Release --no-restore

      - name: Publish Windows x64
        run: dotnet publish CSharpHost/SleepySource.csproj -c Release -r win-x64 --self-contained true -o dist

      - name: Enforce pure C# output
        shell: pwsh
        run: |
          if (!(Test-Path dist/SleepySource.exe)) { throw 'SleepySource.exe is missing' }
          if (Test-Path dist/SleepySource.Engine.exe) { throw 'Go compatibility engine unexpectedly present' }
          $goFiles = Get-ChildItem CSharpHost -Recurse -Filter *.go -ErrorAction SilentlyContinue
          if ($goFiles) { throw 'Go source unexpectedly present inside CSharpHost' }

      - name: Upload Windows build gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: SleepySource-1.0-pure-csharp-gate
          path: dist

      - name: Commit compiled rewrite source
        shell: pwsh
        run: |
          Remove-Item .rewrite -Recurse -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Stage pure C# SleepySource 1.0 rewrite'
          git push origin HEAD:csharp-rewrite-1.0
