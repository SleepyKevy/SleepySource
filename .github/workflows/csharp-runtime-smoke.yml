name: SleepySource 1.0.0 Runtime Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  runtime-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout pure C# source
        uses: actions/checkout@v4

      - name: Use .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish exact branch source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore CSharpHost/SleepySource.csproj -r win-x64
          dotnet publish CSharpHost/SleepySource.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true --no-restore -o smoke-dist
          if (-not (Test-Path 'smoke-dist/SleepySource.exe')) { throw 'SleepySource.exe was not produced.' }
          if (Test-Path 'smoke-dist/SleepySource.Engine.exe') { throw 'Legacy Go engine is present in pure C# output.' }
          if (Get-ChildItem CSharpHost -Recurse -Filter *.go -ErrorAction SilentlyContinue) { throw 'Go source exists under CSharpHost.' }
          if (-not (Test-Path 'smoke-dist/assets/app.ico')) { throw 'Published SleepySource app icon is missing.' }
          if ((Get-Item 'smoke-dist/assets/app.ico').Length -lt 1000) { throw 'Published SleepySource app icon is invalid.' }
          Add-Type -AssemblyName System.Drawing
          $embeddedIcon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path 'smoke-dist/SleepySource.exe').Path)
          if ($null -eq $embeddedIcon) { throw 'SleepySource.exe has no embedded application icon.' }
          try {
            if ($embeddedIcon.Width -lt 16 -or $embeddedIcon.Height -lt 16) { throw 'Embedded SleepySource executable icon is invalid.' }
          }
          finally {
            $embeddedIcon.Dispose()
          }

      - name: Start C# backend and probe local contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'http://127.0.0.1:17891'
          $proc = Start-Process -FilePath (Resolve-Path 'smoke-dist/SleepySource.exe') -ArgumentList '--headless' -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              if ($proc.HasExited) { throw "SleepySource exited before its C# backend became ready. Exit code: $($proc.ExitCode)" }
              try {
                $health = Invoke-WebRequest "$base/api/health" -TimeoutSec 2 -UseBasicParsing
                if ($health.StatusCode -eq 200 -and $health.Content.Trim() -eq 'ok') { $ready = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'Pure C# backend did not bind to 127.0.0.1:17891 in time.' }

            $pages = @('/', '/designer', '/chat', '/overlay', '/countdown', '/alerts')
            foreach ($path in $pages) {
              $r = Invoke-WebRequest ($base + $path) -TimeoutSec 5 -UseBasicParsing
              if ($r.StatusCode -ne 200) { throw "$path returned HTTP $($r.StatusCode)" }
              if ($r.Content -notmatch '<!doctype html>') { throw "$path did not return the expected SleepySource HTML page." }
            }

            $jsonRoutes = @(
              '/api/state',
              '/api/settings',
              '/api/countdown/state',
              '/api/countdown/settings',
              '/api/countdown/profiles',
              '/api/alerts/state?consume=0',
              '/api/alerts/settings',
              '/api/chat/state',
              '/api/chat/settings',
              '/api/profiles',
              '/api/kick/status'
            )
            foreach ($path in $jsonRoutes) {
              $r = Invoke-WebRequest ($base + $path) -TimeoutSec 5 -UseBasicParsing
              if ($r.StatusCode -ne 200) { throw "$path returned HTTP $($r.StatusCode)" }
              try { $null = $r.Content | ConvertFrom-Json } catch { throw "$path did not return valid JSON." }
            }

            $head = Invoke-WebRequest "$base/api/health" -Method Head -TimeoutSec 5 -UseBasicParsing
            if ($head.StatusCode -ne 200) { throw 'HEAD /api/health failed.' }

            $chatBody = @{ username = 'SmokeTester'; text = 'Pure C# chat smoke test'; user_id = '12345' } | ConvertTo-Json
            $chat = Invoke-WebRequest "$base/api/chat/test" -Method Post -ContentType 'application/json' -Body $chatBody -TimeoutSec 5 -UseBasicParsing
            if ($chat.StatusCode -ne 200 -or $chat.Content -notmatch 'SmokeTester') { throw 'Chat test endpoint failed to round-trip through the C# backend.' }

            $alertBody = @{ type = 'follow'; username = 'SmokeFollower' } | ConvertTo-Json
            $alert = Invoke-WebRequest "$base/api/alerts/test" -Method Post -ContentType 'application/json' -Body $alertBody -TimeoutSec 5 -UseBasicParsing
            if ($alert.StatusCode -ne 200) { throw 'Alert queue smoke test failed.' }
            $alertState = Invoke-WebRequest "$base/api/alerts/state?consume=0" -TimeoutSec 5 -UseBasicParsing
            if ($alertState.Content -notmatch 'SmokeFollower') { throw 'Alert queue did not retain the pure C# test alert.' }

            $countdownBody = @{ action = 'reset' } | ConvertTo-Json
            $countdown = Invoke-WebRequest "$base/api/countdown/control" -Method Post -ContentType 'application/json' -Body $countdownBody -TimeoutSec 5 -UseBasicParsing
            if ($countdown.StatusCode -ne 200) { throw 'Countdown control smoke test failed.' }

            $backup = Invoke-WebRequest "$base/api/backup/export" -TimeoutSec 10 -UseBasicParsing
            if ($backup.StatusCode -ne 200 -or $backup.Headers['Content-Type'] -notmatch 'application/zip') { throw 'Backup export contract failed.' }

            if (-not (Test-Path 'smoke-dist/SleepySource_Data')) { throw 'SleepySource_Data was not created beside the pure C# executable.' }
            if (Test-Path 'CSharpHost/CloudflareService.cs') { throw 'Legacy Cloudflare Quick Tunnel service must not exist in the release.' }
            if (Test-Path 'CSharpHost/KickService.cs') { throw 'Legacy Kick credential/auth service must not exist in the release.' }
            if (-not (Test-Path 'CSharpHost/SleepySourceApiService.cs')) { throw 'Hosted SleepySource API service is missing.' }
            Write-Host 'SleepySource 1.0.0 runtime/API smoke checks passed.'
          }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Verify desktop X-close, tray, and title bar contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeClose {
            [DllImport("user32.dll", SetLastError=true)]
            public static extern bool PostMessage(IntPtr hWnd, uint Msg, IntPtr wParam, IntPtr lParam);
          }
          '@

          $source = [IO.File]::ReadAllText('CSharpHost/MainForm.cs')
          if (-not $source.Contains('private readonly NotifyIcon trayIcon;')) { throw 'NotifyIcon tray implementation is missing.' }
          if ($source.Contains('ShowBalloonTip(')) { throw 'Balloon tray notifications should not be used.' }
          if (-not $source.Contains('private const int WM_CLOSE = 0x0010')) { throw 'WM_CLOSE interception is missing.' }
          if (-not $source.Contains('GracefulExitBudgetMs = 500')) { throw '500 ms exit watchdog is missing.' }
          if ($source.Contains('Kill(entireProcessTree: true)')) { throw 'Exit watchdog must terminate SleepySource directly instead of waiting on the WebView2 process tree.' }
          if (-not $source.Contains('private static void ForceProcessExit() => Environment.Exit(0);')) { throw 'Direct 500 ms SleepySource exit fallback is missing.' }
          if (-not $source.Contains('OperatingSystem.IsWindowsVersionAtLeast(10, 0, 22000)')) { throw 'Windows 11 title-bar guard is missing.' }
          if (-not $source.Contains('DWMWA_CAPTION_COLOR = 35')) { throw 'Native title-bar caption color is missing.' }
          if (-not $source.Contains('DWMWA_TEXT_COLOR = 36')) { throw 'Native title-bar text color is missing.' }
          if (-not $source.Contains('DWMWA_BORDER_COLOR = 34')) { throw 'Native title-bar border color is missing.' }
          if (-not $source.Contains('Color.FromArgb(2, 5, 10)')) { throw 'SleepySource dark title-bar color is missing.' }
          if (-not $source.Contains('Color.White')) { throw 'White title-bar text is missing.' }

          $proc = Start-Process -FilePath (Resolve-Path 'smoke-dist/SleepySource.exe') -PassThru
          try {
            $window = [IntPtr]::Zero
            $ready = $false
            for ($i = 0; $i -lt 80; $i++) {
              if ($proc.HasExited) { throw "SleepySource desktop process exited before becoming ready. Exit code: $($proc.ExitCode)" }
              $proc.Refresh()
              $window = $proc.MainWindowHandle
              if ($window -ne [IntPtr]::Zero) {
                try {
                  $health = Invoke-WebRequest 'http://127.0.0.1:17891/api/health' -TimeoutSec 1 -UseBasicParsing
                  if ($health.StatusCode -eq 200 -and $health.Content.Trim() -eq 'ok') { $ready = $true; break }
                } catch { }
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready -or $window -eq [IntPtr]::Zero) { throw 'SleepySource desktop app did not become ready.' }

            $timer = [Diagnostics.Stopwatch]::StartNew()
            if (-not [NativeClose]::PostMessage($window, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero)) { throw 'Could not post WM_CLOSE to SleepySource.' }
            if (-not $proc.WaitForExit(1500)) { throw 'SleepySource.exe was still running 1.5 seconds after X-close.' }
            $timer.Stop()
            Write-Host "SleepySource X-close passed in $($timer.ElapsedMilliseconds) ms; tray/title-bar source contracts are present."
          }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload smoke-tested Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SleepySource-1.0.0-Smoke-Tested
          path: smoke-dist/
          if-no-files-found: error

      - name: Publish runtime smoke commit status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RESULT -eq 'success') {
            $state = 'success'
            $description = 'Windows runtime smoke passed.'
          }
          else {
            $state = 'failure'
            $description = 'Windows runtime smoke failed.'
          }
          $body = @{
            state = $state
            context = 'sleepysource/runtime-smoke'
            description = $description
            target_url = $env:RUN_URL
          } | ConvertTo-Json
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:REPO/statuses/$env:SHA" -Headers $headers -ContentType 'application/json' -Body $body | Out-Null

