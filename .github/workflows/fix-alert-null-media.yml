name: Fix SleepySource CSharp Alert Null Media

on:
  push:
    branches:
      - csharp-rewrite-1.0
    paths:
      - .github/workflows/fix-alert-null-media.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: csharp-rewrite-1.0
          fetch-depth: 0
      - name: Make alert presentation media checks null-safe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('CSharpHost/AlertService.cs')
          s=p.read_text(encoding='utf-8')
          pairs={
            'st.VisualFile.Length > 0':'!string.IsNullOrWhiteSpace(st.VisualFile)',
            'st.SoundFile.Length > 0':'!string.IsNullOrWhiteSpace(st.SoundFile)',
          }
          for old,new in pairs.items():
            if s.count(old)!=1:
              raise SystemExit(f'Expected exactly one {old!r}, found {s.count(old)}')
            s=s.replace(old,new)
          p.write_text(s,encoding='utf-8',newline='')
          PY
          git diff --check
      - name: Commit alert null-media fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CSharpHost/AlertService.cs
          git commit -m 'Fix null alert media handling in C# backend'
          git push origin HEAD:csharp-rewrite-1.0
