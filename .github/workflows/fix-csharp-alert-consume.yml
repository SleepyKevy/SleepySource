name: Fix CSharp Alert Consume
on:
  push:
    branches: [csharp-rewrite-1.0]
    paths: ['.github/workflows/fix-csharp-alert-consume.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: csharp-rewrite-1.0
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Patch alert consume path
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p='CSharpHost/AlertService.cs'
          $s=Get-Content $p -Raw
          $old='Settings = Clone(settings), Current = current == null ? null : Clone(current), Queue = queue.Count == 0 ? null! : queue.Select(Clone).ToList(), QueueDepth = queue.Count,'
          $new='Settings = Clone(settings), Current = current, Queue = queue.Count == 0 ? null! : queue.Select(Clone).ToList(), QueueDepth = queue.Count,'
          if(-not $s.Contains($old)){ throw 'Expected alert state clone line not found.' }
          $s=$s.Replace($old,$new)
          $old2='Style = Clone(st), Title = RenderTemplate(st.TitleTemplate, ev), Message = RenderTemplate(st.MessageTemplate, ev), StartedAtMS = now, EndsAtMS = now + st.EnterDurationMS + st.DurationMS + st.ExitDurationMS,'
          $new2='Style = st, Title = RenderTemplate(st.TitleTemplate, ev), Message = RenderTemplate(st.MessageTemplate, ev), StartedAtMS = now, EndsAtMS = now + st.EnterDurationMS + st.DurationMS + st.ExitDurationMS,'
          if(-not $s.Contains($old2)){ throw 'Expected presentation style clone line not found.' }
          $s=$s.Replace($old2,$new2)
          $s=$s.Replace('.Replace("{tier}", ev.Tier).Replace("{gift}", ev.GiftName).Replace("{reward}", ev.RewardTitle).Replace("{input}", ev.UserInput)', '.Replace("{tier}", ev.Tier ?? "").Replace("{gift}", ev.GiftName ?? "").Replace("{reward}", ev.RewardTitle ?? "").Replace("{input}", ev.UserInput ?? "")')
          $s=$s.TrimEnd("`r","`n")+"`n"
          [System.IO.File]::WriteAllText($p,$s,[System.Text.UTF8Encoding]::new($false))
          git diff --check
      - name: Publish and exercise alert consume
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore CSharpHost/SleepySource.csproj -r win-x64
          dotnet publish CSharpHost/SleepySource.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true --no-restore -o verify-alert
          $base='http://127.0.0.1:17891'
          $proc=Start-Process -FilePath (Resolve-Path 'verify-alert/SleepySource.exe') -ArgumentList '--headless' -PassThru
          try {
            for($i=0;$i-lt50;$i++){ try { if((Invoke-WebRequest "$base/api/health" -UseBasicParsing -TimeoutSec 2).StatusCode-eq200){break} } catch {}; Start-Sleep -Milliseconds 400 }
            $q=Invoke-RestMethod "$base/api/alerts/test" -Method Post -ContentType 'application/json' -Body '{"type":"follow","username":"ParityFollower"}' -TimeoutSec 10
            if([int]$q.queue_depth-ne1){throw 'Alert did not queue.'}
            $c=Invoke-RestMethod "$base/api/alerts/state?consumer=overlay" -TimeoutSec 10
            if([int]$c.queue_depth-ne0){throw 'Alert queue was not consumed.'}
            if($c.current.username-ne'ParityFollower'){throw 'Consumed alert username mismatch.'}
            $again=Invoke-RestMethod "$base/api/alerts/state?consume=0" -TimeoutSec 10
            if($again.current.username-ne'ParityFollower'){throw 'Active alert was not stable after consume.'}
          } finally { if($proc-and-not$proc.HasExited){Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue} }
      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CSharpHost/AlertService.cs
          git commit -m 'Fix C# alert overlay consumption'
          git push origin HEAD:csharp-rewrite-1.0
