name: Fix SleepySource Mutation Parity Validator

on:
  push:
    branches:
      - csharp-rewrite-1.0
    paths:
      - .github/workflows/fix-mutation-parity-validator.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: csharp-rewrite-1.0
          fetch-depth: 0
      - name: Correct baseline alert presentation path
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/csharp-go-mutation-parity.yml
          count=$(grep -o 'consumed.current.event.username' "$file" | wc -l)
          test "$count" -eq 1
          sed -i 's/consumed\.current\.event\.username/consumed.current.username/' "$file"
          git diff --check
      - name: Commit validator fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/csharp-go-mutation-parity.yml
          git commit -m 'Fix alert assertion in mutation parity validator'
          git push origin HEAD:csharp-rewrite-1.0
