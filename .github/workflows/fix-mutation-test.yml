name: Fix Mutation Parity Assertion

on:
  push:
    branches:
      - csharp-rewrite-1.0
    paths:
      - .validation/FIX_MUTATION_TEST

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: csharp-rewrite-1.0
          fetch-depth: 0
      - name: Correct baseline alert presentation assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/csharp-go-mutation-parity.yml')
          s=p.read_text()
          old="$consumed.current.event.username -eq 'ParityFollower'"
          new="$consumed.current.username -eq 'ParityFollower'"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one old assertion, found {s.count(old)}')
          p.write_text(s.replace(old,new), newline='\n')
          PY
      - name: Commit test correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/csharp-go-mutation-parity.yml
          git commit -m 'Fix alert presentation assertion in mutation parity test'
          git push origin HEAD:csharp-rewrite-1.0
