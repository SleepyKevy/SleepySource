name: Fix SleepySource Splash Handoff Once

on:
  push:
    branches:
      - fix-splash-handoff
    paths:
      - .github/workflows/fix-splash-handoff-once.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Fix WebView2 splash to dashboard handoff
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'CSharpHost/web/enter.html'
          $text = [IO.File]::ReadAllText($path)
          $old = "    window.setTimeout(() => window.location.assign('/designer'), 180);"
          $new = @"
    window.setTimeout(() => {
      try {
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage('open');
          return;
        }
      } catch {}
      window.location.assign('http://127.0.0.1:17891/designer');
    }, 180);
"@.TrimEnd()
          if (-not $text.Contains($old)) { throw 'Expected broken relative /designer handoff was not found.' }
          $text = $text.Replace($old, $new)
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText($path, $text, $utf8)

          $fixed = [IO.File]::ReadAllText($path)
          if ($fixed.Contains("window.location.assign('/designer')")) { throw 'Broken relative dashboard navigation still exists.' }
          if (-not $fixed.Contains("window.chrome.webview.postMessage('open')")) { throw 'WebView2 open message handoff is missing.' }

          $host = [IO.File]::ReadAllText('CSharpHost/MainForm.cs')
          if (-not $host.Contains('TryGetWebMessageAsString')) { throw 'C# WebView message receiver is missing.' }
          if (-not $host.Contains('string.Equals(message, "open"')) { throw 'C# open message handler is missing.' }
          if (-not $host.Contains('Navigate(EngineHost + "designer")')) { throw 'C# dashboard navigation target is missing.' }

          git diff --check

      - name: Publish and verify real dashboard route
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore CSharpHost/SleepySource.csproj -r win-x64
          dotnet publish CSharpHost/SleepySource.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true --no-restore -o splash-fix-dist
          if (-not (Test-Path 'splash-fix-dist/SleepySource.exe')) { throw 'SleepySource.exe was not produced.' }
          if (-not (Test-Path 'splash-fix-dist/web/enter.html')) { throw 'Published splash page is missing.' }
          $publishedSplash = [IO.File]::ReadAllText((Resolve-Path 'splash-fix-dist/web/enter.html'))
          if (-not $publishedSplash.Contains("window.chrome.webview.postMessage('open')")) { throw 'Published splash does not contain fixed WebView handoff.' }

          $proc = Start-Process -FilePath (Resolve-Path 'splash-fix-dist/SleepySource.exe') -ArgumentList '--headless' -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              if ($proc.HasExited) { throw "SleepySource exited before backend became ready. Exit code: $($proc.ExitCode)" }
              try {
                $health = Invoke-WebRequest 'http://127.0.0.1:17891/api/health' -TimeoutSec 2 -UseBasicParsing
                if ($health.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'Backend did not become ready.' }
            $dashboard = Invoke-WebRequest 'http://127.0.0.1:17891/designer' -TimeoutSec 5 -UseBasicParsing
            if ($dashboard.StatusCode -ne 200 -or $dashboard.Content -notmatch '<!doctype html>') { throw 'Real /designer dashboard route failed.' }
          }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Commit verified splash fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CSharpHost/web/enter.html
          git commit -m 'Fix splash to dashboard WebView2 handoff'
          git push origin HEAD:fix-splash-handoff
