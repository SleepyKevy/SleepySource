name: Import SleepySource Beta Source

on:
  push:
    paths:
      - '.github/workflows/import-source.yml'

permissions:
  contents: write

jobs:
  import-source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import source ZIP into repository root
        shell: bash
        run: |
          set -euo pipefail

          ZIP='SleepySource_1.0_Beta_Source(7).zip'
          SRC_DIR='SleepySource 1.0 Beta Source'

          test -f "$ZIP"
          rm -rf /tmp/sleepysource-import
          mkdir -p /tmp/sleepysource-import
          unzip -q "$ZIP" -d /tmp/sleepysource-import
          test -d "/tmp/sleepysource-import/$SRC_DIR"

          SOURCE_FILE_COUNT=$(find "/tmp/sleepysource-import/$SRC_DIR" -type f | wc -l | tr -d ' ')
          if [ "$SOURCE_FILE_COUNT" != '81' ]; then
            echo "Expected 81 source files, found $SOURCE_FILE_COUNT"
            exit 1
          fi

          cp .gitignore /tmp/sleepysource-import/.gitignore.keep

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "/tmp/sleepysource-import/$SRC_DIR"/. .
          cp /tmp/sleepysource-import/.gitignore.keep .gitignore

          test -f README.txt
          test -f CSharpHost/SleepySource.csproj
          test -f CompatibilityEngine/go.mod
          test -f CompatibilityEngine/main.go

          FINAL_SOURCE_COUNT=$(find . -type f ! -path './.git/*' ! -name '.gitignore' | wc -l | tr -d ' ')
          if [ "$FINAL_SOURCE_COUNT" != '81' ]; then
            echo "Expected 81 source files after import, found $FINAL_SOURCE_COUNT"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import SleepySource 1.0 Beta source'
          git push origin HEAD:main
