name: Package SleepySource 1.0 Source

on:
  push:
    branches:
      - csharp-rewrite-1.0
    paths:
      - .github/workflows/package-1-0-source.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout merged main source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Create clean source archive
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $items=@('CSharpHost','.github','.gitignore','README.txt','RELEASE_NOTES.txt','VALIDATION.txt')
          foreach($item in $items){if(-not(Test-Path $item)){throw "Missing source item: $item"}}
          if(Get-ChildItem . -Recurse -Filter *.go -ErrorAction SilentlyContinue){throw 'Go source found in merged main tree.'}
          if(Test-Path 'CompatibilityEngine'){throw 'CompatibilityEngine found in merged main tree.'}
          if(Test-Path 'go.mod'){throw 'go.mod found in merged main tree.'}
          Compress-Archive -Path $items -DestinationPath 'SleepySource_1.0_Source.zip' -CompressionLevel Optimal
      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: SleepySource-1.0-Source
          path: SleepySource_1.0_Source.zip
          if-no-files-found: error
