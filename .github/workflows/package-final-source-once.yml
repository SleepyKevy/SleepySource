name: Package Final SleepySource 1.0 Source Once

on:
  push:
    branches:
      - fix-fast-exit-tray
    paths:
      - .github/workflows/package-final-source-once.yml

permissions:
  contents: read

jobs:
  package-source:
    runs-on: windows-latest
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Build clean source archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rootName = 'SleepySource 1.0 Official Source'
          $root = Join-Path $PWD $rootName
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          $excludeDirs = @('.git', 'bin', 'obj', 'publish', 'dist', 'build', '.vs')
          Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' -and $_.Name -ne $rootName } | ForEach-Object {
            if ($_.PSIsContainer) {
              Copy-Item $_.FullName (Join-Path $root $_.Name) -Recurse -Force
            } else {
              Copy-Item $_.FullName (Join-Path $root $_.Name) -Force
            }
          }

          foreach ($name in $excludeDirs) {
            Get-ChildItem $root -Directory -Recurse -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -eq $name } |
              Sort-Object FullName -Descending |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }

          if (Get-ChildItem $root -Recurse -Filter '*.go' -ErrorAction SilentlyContinue) { throw 'Go source found in final C# package.' }
          if (Get-ChildItem $root -Recurse -Filter 'SleepySource.Engine.exe' -ErrorAction SilentlyContinue) { throw 'Legacy engine found in final C# package.' }
          if (-not (Test-Path (Join-Path $root 'CSharpHost/MainForm.cs'))) { throw 'MainForm.cs missing from source package.' }
          if (-not (Select-String -Path (Join-Path $root 'CSharpHost/MainForm.cs') -SimpleMatch 'GracefulExitBudgetMs = 500' -Quiet)) { throw 'Fast-exit source fix missing.' }
          if (-not (Select-String -Path (Join-Path $root 'CSharpHost/MainForm.cs') -SimpleMatch 'Kill(entireProcessTree: true)' -Quiet)) { throw 'Process-tree fallback missing.' }
          if (-not (Select-String -Path (Join-Path $root '.github/workflows/csharp-runtime-smoke.yml') -SimpleMatch 'Verify desktop X-close and tray contract' -Quiet)) { throw 'Permanent X-close regression test missing.' }

          Compress-Archive -Path $root -DestinationPath 'SleepySource_1.0_Official_Source.zip' -CompressionLevel Optimal -Force

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SleepySource-1.0-Official-Source-Final
          path: SleepySource_1.0_Official_Source.zip
          if-no-files-found: error
