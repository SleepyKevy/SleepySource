name: Package SleepySource 1.0 Official Source

on:
  push:
    branches:
      - csharp-rewrite-1.0
    paths:
      - .github/workflows/package-source-once.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build official source package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'SleepySource 1.0 Official Source'
          New-Item $root -ItemType Directory -Force | Out-Null
          Copy-Item CSharpHost "$root/CSharpHost" -Recurse
          Copy-Item README.txt,RELEASE_NOTES.txt,VALIDATION.txt $root
          if (Get-ChildItem $root -Recurse -Filter *.go -ErrorAction SilentlyContinue) { throw 'Go source leaked into source package.' }
          if (Get-ChildItem $root -Recurse -Filter go.mod -ErrorAction SilentlyContinue) { throw 'go.mod leaked into source package.' }
          if (Get-ChildItem $root -Recurse -Filter SleepySource.Engine.exe -ErrorAction SilentlyContinue) { throw 'Legacy Go engine leaked into source package.' }
          if (Get-ChildItem $root -Recurse -Directory | Where-Object { $_.Name -in @('bin','obj','publish','dist','build','.vs') }) { throw 'Build output leaked into source package.' }
          Compress-Archive -Path $root -DestinationPath SleepySource_1.0_Official_Source.zip -CompressionLevel Optimal
      - name: Upload official source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SleepySource_1.0_Official_Source
          path: SleepySource_1.0_Official_Source.zip
          if-no-files-found: error
