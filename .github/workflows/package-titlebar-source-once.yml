name: Package SleepySource 1.0 Title Bar Source Once

on:
  push:
    branches:
      - package-titlebar-source
    paths:
      - .github/workflows/package-titlebar-source-once.yml

permissions:
  contents: read

jobs:
  package-source:
    runs-on: windows-latest
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Build clean source ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'SleepySource 1.0 Official Source'
          $zip = Join-Path $env:RUNNER_TEMP 'SleepySource_1.0_Official_Source.zip'
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' } | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $root $_.Name) -Recurse -Force
          }

          foreach ($name in @('bin','obj','publish','dist','build','.vs')) {
            Get-ChildItem $root -Directory -Recurse -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -eq $name } |
              Sort-Object FullName -Descending |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }

          if (Get-ChildItem $root -Recurse -Filter '*.go' -ErrorAction SilentlyContinue) { throw 'Go source found in final source package.' }
          if (Get-ChildItem $root -Recurse -Filter 'SleepySource.Engine.exe' -ErrorAction SilentlyContinue) { throw 'Legacy engine found in final source package.' }
          $mainForm = Join-Path $root 'CSharpHost/MainForm.cs'
          if (-not (Select-String -Path $mainForm -SimpleMatch 'DWMWA_CAPTION_COLOR = 35' -Quiet)) { throw 'Title-bar caption customization missing.' }
          if (-not (Select-String -Path $mainForm -SimpleMatch 'DWMWA_TEXT_COLOR = 36' -Quiet)) { throw 'Title-bar text customization missing.' }
          if (-not (Select-String -Path $mainForm -SimpleMatch 'GracefulExitBudgetMs = 500' -Quiet)) { throw 'Fast-exit fix missing.' }

          Compress-Archive -Path $root -DestinationPath $zip -CompressionLevel Optimal -Force
          Write-Host "Source ZIP created at $zip"

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SleepySource-1.0-Official-Source-TitleBar
          path: ${{ runner.temp }}/SleepySource_1.0_Official_Source.zip
          if-no-files-found: error
