name: Publish Exact Verified SleepySource 1.0.0 Release

on:
  push:
    branches:
      - agent/import-fresh-v1.0.0

permissions:
  contents: write
  actions: read
  statuses: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish release-run URL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state='success' \
            -f context='sleepysource/release-finalizer-run' \
            -f description='Exact release finalizer started.' \
            -f target_url="$RUN_URL" >/dev/null

      - name: Checkout transport branch and all refs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact source commit is on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXPECTED_SHA='cc8bd1d10d92393c6aa2ac9c6048e9de2c484c33'
          EXPECTED_TREE='a461ebf7409b8e0572781ede0881afc27f202257'
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          TREE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$MAIN_SHA" --jq '.tree.sha')"
          [ "$MAIN_SHA" = "$EXPECTED_SHA" ]
          [ "$TREE_SHA" = "$EXPECTED_TREE" ]
          git fetch origin main
          git show origin/main:readme.txt > "$RUNNER_TEMP/readme.txt"
          git show origin/main:release_notes.txt > "$RUNNER_TEMP/release_notes.txt"
          git show origin/main:CSharpHost/web/index.html > "$RUNNER_TEMP/index.html"

      - name: Download previous verified public package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/old-artifact"
          gh run download 32099329368 \
            --repo "$GITHUB_REPOSITORY" \
            --name 'SleepySource-1.0.0-Release-Packages' \
            --dir "$RUNNER_TEMP/old-artifact"
          test -f "$RUNNER_TEMP/old-artifact/SleepySource_1.0.0_Public.zip"

      - name: Reconstruct and verify exact public release contents
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_PARENT="$RUNNER_TEMP/rebuilt-public"
          PUBLIC_ROOT="$PUBLIC_PARENT/SleepySource 1.0.0"
          mkdir -p "$RUNNER_TEMP/old-public" "$PUBLIC_ROOT"
          unzip -q "$RUNNER_TEMP/old-artifact/SleepySource_1.0.0_Public.zip" -d "$RUNNER_TEMP/old-public"
          cp -a "$RUNNER_TEMP/old-public/." "$PUBLIC_ROOT/"
          cp "$RUNNER_TEMP/readme.txt" "$PUBLIC_ROOT/readme.txt"
          cp "$RUNNER_TEMP/release_notes.txt" "$PUBLIC_ROOT/release_notes.txt"
          cp "$RUNNER_TEMP/index.html" "$PUBLIC_ROOT/web/index.html"

          echo '780f45a0a9a7749d75b238938253dea183f1a1acf93e48cd88754cc7a3716253  SleepySource.exe' | \
            (cd "$PUBLIC_ROOT" && sha256sum -c -)
          cat payload/exe_patch_*.b64 | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/exe.patch.zlib"

          python3 - "$PUBLIC_ROOT/SleepySource.exe" "$RUNNER_TEMP/exe.patch.zlib" <<'PY'
          import struct, sys, zlib
          from pathlib import Path
          exe_path = Path(sys.argv[1])
          raw = zlib.decompress(Path(sys.argv[2]).read_bytes())
          if raw[:4] != b'SP1\0':
              raise SystemExit('Invalid sparse patch signature')
          final_len = struct.unpack_from('<Q', raw, 4)[0]
          count = struct.unpack_from('<I', raw, 12)[0]
          pos = 16
          data = bytearray(exe_path.read_bytes())
          if len(data) != final_len:
              raise SystemExit(f'Unexpected EXE length: {len(data)} != {final_len}')
          for _ in range(count):
              offset = struct.unpack_from('<Q', raw, pos)[0]
              size = struct.unpack_from('<I', raw, pos + 8)[0]
              pos += 12
              data[offset:offset + size] = raw[pos:pos + size]
              pos += size
          if pos != len(raw):
              raise SystemExit('Sparse patch has trailing or missing data')
          exe_path.write_bytes(data)
          PY

          cd "$PUBLIC_ROOT"
          sha256sum -c "$GITHUB_WORKSPACE/payload/public_manifest.sha256"
          echo 'f82172ae55f74180ad99150d312a9b09ec418e29535a12b1eda582cef3cf8fc6  SleepySource.exe' | sha256sum -c -
          cd "$PUBLIC_PARENT"
          zip -q -r -9 "$RUNNER_TEMP/SleepySource_1.0.0.zip" 'SleepySource 1.0.0'
          unzip -t "$RUNNER_TEMP/SleepySource_1.0.0.zip" >/dev/null

      - name: Replace v1.0.0 tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA='cc8bd1d10d92393c6aa2ac9c6048e9de2c484c33'
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.0" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.0.0" -f sha="$TARGET_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref='refs/tags/v1.0.0' -f sha="$TARGET_SHA" >/dev/null
          fi

          if gh release view 'v1.0.0' --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mapfile -t assets < <(gh release view 'v1.0.0' --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            for asset in "${assets[@]}"; do
              [ -n "$asset" ] && gh release delete-asset 'v1.0.0' "$asset" --repo "$GITHUB_REPOSITORY" -y
            done
            gh release upload 'v1.0.0' "$RUNNER_TEMP/SleepySource_1.0.0.zip" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit 'v1.0.0' --repo "$GITHUB_REPOSITORY" --title 'SleepySource 1.0.0' --notes-file "$RUNNER_TEMP/release_notes.txt" --draft=false --prerelease=false
          else
            gh release create 'v1.0.0' "$RUNNER_TEMP/SleepySource_1.0.0.zip" --repo "$GITHUB_REPOSITORY" --target "$TARGET_SHA" --title 'SleepySource 1.0.0' --notes-file "$RUNNER_TEMP/release_notes.txt"
          fi

      - name: Download and verify published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXPECTED_SHA='cc8bd1d10d92393c6aa2ac9c6048e9de2c484c33'
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.0" --jq '.object.sha')"
          [ "$MAIN_SHA" = "$EXPECTED_SHA" ]
          [ "$TAG_SHA" = "$EXPECTED_SHA" ]

          RELEASE_JSON="$(gh release view 'v1.0.0' --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,assets)"
          [ "$(jq -r '.tagName' <<<"$RELEASE_JSON")" = 'v1.0.0' ]
          [ "$(jq -r '.name' <<<"$RELEASE_JSON")" = 'SleepySource 1.0.0' ]
          [ "$(jq -r '.isDraft' <<<"$RELEASE_JSON")" = 'false' ]
          [ "$(jq -r '.isPrerelease' <<<"$RELEASE_JSON")" = 'false' ]
          mapfile -t names < <(jq -r '.assets[].name' <<<"$RELEASE_JSON")
          [ "${#names[@]}" -eq 1 ]
          [ "${names[0]}" = 'SleepySource_1.0.0.zip' ]

          mkdir -p "$RUNNER_TEMP/release-check" "$RUNNER_TEMP/release-extracted"
          gh release download 'v1.0.0' --repo "$GITHUB_REPOSITORY" --pattern 'SleepySource_1.0.0.zip' --dir "$RUNNER_TEMP/release-check"
          unzip -q "$RUNNER_TEMP/release-check/SleepySource_1.0.0.zip" -d "$RUNNER_TEMP/release-extracted"
          cd "$RUNNER_TEMP/release-extracted/SleepySource 1.0.0"
          sha256sum -c "$GITHUB_WORKSPACE/payload/public_manifest.sha256"
          echo 'f82172ae55f74180ad99150d312a9b09ec418e29535a12b1eda582cef3cf8fc6  SleepySource.exe' | sha256sum -c -

      - name: Remove temporary import branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/agent/import-fresh-v1.0.0"
