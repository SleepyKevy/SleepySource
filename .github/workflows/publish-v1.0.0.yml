name: Publish SleepySource 1.0.0

on:
  push:
    branches:
      - main

permissions:
  contents: write
  statuses: write
  actions: read

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish SleepySource 1.0.0'
    runs-on: windows-latest
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4

      - name: Wait for exact Windows runtime smoke success
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runId = $null
          for ($i = 0; $i -lt 90; $i++) {
            $commitStatus = (& gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/status") | ConvertFrom-Json
            $runtime = @($commitStatus.statuses | Where-Object { $_.context -eq 'sleepysource/runtime-smoke' }) | Select-Object -First 1
            if ($runtime) {
              if ($runtime.state -eq 'success') {
                if ($runtime.target_url -match '/actions/runs/(\d+)$') {
                  $runId = $Matches[1]
                  break
                }
                throw 'Runtime smoke succeeded but its Actions run ID could not be resolved.'
              }
              if ($runtime.state -eq 'failure' -or $runtime.state -eq 'error') {
                throw "Runtime smoke failed for $env:GITHUB_SHA."
              }
            }
            Start-Sleep -Seconds 5
          }
          if (-not $runId) { throw 'Runtime smoke success was not reported for the exact release commit.' }
          "SMOKE_RUN_ID=$runId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using smoke-tested Windows artifact from run $runId."

      - name: Download exact smoke-tested Windows build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'smoke-dist') { Remove-Item 'smoke-dist' -Recurse -Force }
          New-Item -ItemType Directory -Path 'smoke-dist' -Force | Out-Null
          & gh run download $env:SMOKE_RUN_ID --repo $env:GITHUB_REPOSITORY --name 'SleepySource-1.0.0-Smoke-Tested' --dir 'smoke-dist'
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the smoke-tested Windows build.' }
          if (-not (Test-Path 'smoke-dist/SleepySource.exe')) { throw 'Downloaded artifact is missing SleepySource.exe.' }

      - name: Package and verify final release ZIPs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'release-dist'
          $public = Join-Path $release 'SleepySource 1.0.0'
          $source = Join-Path $release 'SleepySource 1.0.0 Source'
          if (Test-Path $release) { Remove-Item $release -Recurse -Force }
          New-Item -ItemType Directory -Path $public -Force | Out-Null
          New-Item -ItemType Directory -Path $source -Force | Out-Null

          Copy-Item 'smoke-dist/SleepySource.exe' $public -Force
          Copy-Item 'smoke-dist/assets' $public -Recurse -Force
          Copy-Item 'smoke-dist/web' $public -Recurse -Force
          Copy-Item 'readme.txt' $public -Force
          Copy-Item 'release_notes.txt' $public -Force

          $publicZip = Join-Path $release 'SleepySource_1.0.0.zip'
          Compress-Archive -Path $public -DestinationPath $publicZip -CompressionLevel Optimal

          $exclude = @('.git', 'smoke-dist', 'release-dist')
          Get-ChildItem -Force | Where-Object { $exclude -notcontains $_.Name } | ForEach-Object {
            Copy-Item $_.FullName -Destination $source -Recurse -Force
          }
          $sourceZip = Join-Path $release 'SleepySource_1.0.0_Source.zip'
          Compress-Archive -Path $source -DestinationPath $sourceZip -CompressionLevel Optimal

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $pubArchive = [IO.Compression.ZipFile]::OpenRead($publicZip)
          try {
            $pubNames = @($pubArchive.Entries | ForEach-Object FullName)
            if ($pubNames -notcontains 'SleepySource 1.0.0/SleepySource.exe') { throw 'Release ZIP is missing SleepySource.exe.' }
            if ($pubNames -notcontains 'SleepySource 1.0.0/readme.txt') { throw 'Release ZIP is missing readme.txt.' }
            if ($pubNames -notcontains 'SleepySource 1.0.0/release_notes.txt') { throw 'Release ZIP is missing release_notes.txt.' }
            if ($pubNames | Where-Object { $_ -match '(^|/)SleepySource_Data/' }) { throw 'Public ZIP contains generated SleepySource_Data.' }
            if ($pubNames | Where-Object { $_ -match '\.xml$' }) { throw 'Public ZIP contains XML documentation files.' }
          }
          finally { $pubArchive.Dispose() }

          $srcArchive = [IO.Compression.ZipFile]::OpenRead($sourceZip)
          try {
            $srcNames = @($srcArchive.Entries | ForEach-Object FullName)
            if ($srcNames -notcontains 'SleepySource 1.0.0 Source/CSharpHost/UpdateService.cs') { throw 'Source ZIP is missing UpdateService.cs.' }
            if ($srcNames -notcontains 'SleepySource 1.0.0 Source/.github/workflows/publish-v1.0.0.yml') { throw 'Source ZIP does not match the release commit.' }
            if ($srcNames | Where-Object { $_ -match '(^|/)\.git/' }) { throw 'Source ZIP contains .git metadata.' }
          }
          finally { $srcArchive.Dispose() }

          Get-FileHash $publicZip -Algorithm SHA256 | Format-List
          Get-FileHash $sourceZip -Algorithm SHA256 | Format-List

      - name: Upload exact release ZIPs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SleepySource-1.0.0-Release-Packages
          path: |
            release-dist/SleepySource_1.0.0.zip
            release-dist/SleepySource_1.0.0_Source.zip
          if-no-files-found: error

      - name: Publish or refresh GitHub v1.0.0 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          & gh release view 'v1.0.0' --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)

          if ($releaseExists) {
            & gh release upload 'v1.0.0' `
              'release-dist/SleepySource_1.0.0.zip' `
              'release-dist/SleepySource_1.0.0_Source.zip' `
              --clobber `
              --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'GitHub v1.0.0 release asset refresh failed.' }

            & gh release edit 'v1.0.0' `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title 'SleepySource 1.0.0' `
              --notes-file 'release_notes.txt'
            if ($LASTEXITCODE -ne 0) { throw 'GitHub v1.0.0 release metadata refresh failed.' }
          }
          else {
            & gh release create 'v1.0.0' `
              'release-dist/SleepySource_1.0.0.zip' `
              'release-dist/SleepySource_1.0.0_Source.zip' `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title 'SleepySource 1.0.0' `
              --notes-file 'release_notes.txt'
            if ($LASTEXITCODE -ne 0) { throw 'GitHub v1.0.0 release creation failed.' }
          }

      - name: Publish release result commit status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RESULT -eq 'success') {
            $state = 'success'
            $description = 'SleepySource 1.0.0 release published.'
          }
          else {
            $state = 'failure'
            $description = 'SleepySource 1.0.0 release publish failed.'
          }
          $body = @{
            state = $state
            context = 'sleepysource/release-publish'
            description = $description
            target_url = $env:RUN_URL
          } | ConvertTo-Json
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -Headers $headers -ContentType 'application/json' -Body $body | Out-Null
