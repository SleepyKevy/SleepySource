name: SleepyMusic Native Audio Windows Build

on:
  pull_request:
    branches: [main]
    paths:
      - '_sleepymusic_build/**'
      - '.github/workflows/sleepymusic-temp-build.yml'

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Use .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Reconstruct file-add-fixed source and apply native audio overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem '_sleepymusic_build/fix_chunks/part*' | Sort-Object Name
          if ($parts.Count -ne 7) { throw "Expected 7 base payload chunks, found $($parts.Count)." }
          $payload = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('_sleepymusic_build/fix_payload.zip', [Convert]::FromBase64String($payload))
          Expand-Archive '_sleepymusic_build/fix_payload.zip' '_sleepymusic_build/CSharpHost' -Force
          New-Item -ItemType Directory -Force '_sleepymusic_build/CSharpHost/assets' | Out-Null
          Copy-Item 'CSharpHost/assets/app.ico' '_sleepymusic_build/CSharpHost/assets/app.ico' -Force
          & '_sleepymusic_build/native_response_fix.ps1'

          $overlayParts = Get-ChildItem '_sleepymusic_build/native_audio_chunks/part*' | Sort-Object Name
          if ($overlayParts.Count -ne 5) { throw "Expected 5 native audio overlay chunks, found $($overlayParts.Count)." }
          $overlayText = ($overlayParts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('_sleepymusic_build/native_audio_overlay.zip', [Convert]::FromBase64String($overlayText))
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $overlayZip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path '_sleepymusic_build/native_audio_overlay.zip'))
          try {
            $overlayNames = $overlayZip.Entries | ForEach-Object FullName
            foreach ($required in @('AudioEngine.cs','MainForm.cs','BackendHost.cs','web/index.html','SleepyMusic.csproj')) {
              if ($overlayNames -notcontains $required) { throw "Native audio overlay is missing $required" }
            }
          } finally { $overlayZip.Dispose() }
          Expand-Archive '_sleepymusic_build/native_audio_overlay.zip' '_sleepymusic_build/CSharpHost' -Force

          foreach ($required in @('AudioEngine.cs','MainForm.cs','BackendHost.cs','LibraryService.cs','web/index.html','SleepyMusic.csproj')) {
            if (-not (Test-Path (Join-Path '_sleepymusic_build/CSharpHost' $required))) { throw "Final source is missing $required" }
          }

      - name: Verify native audio and file-add contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ui = Get-Content '_sleepymusic_build/CSharpHost/web/index.html' -Raw
          $form = Get-Content '_sleepymusic_build/CSharpHost/MainForm.cs' -Raw
          $backend = Get-Content '_sleepymusic_build/CSharpHost/BackendHost.cs' -Raw
          $library = Get-Content '_sleepymusic_build/CSharpHost/LibraryService.cs' -Raw
          $engine = Get-Content '_sleepymusic_build/CSharpHost/AudioEngine.cs' -Raw
          $project = Get-Content '_sleepymusic_build/CSharpHost/SleepyMusic.csproj' -Raw

          foreach ($needle in @('pick-folder','pick-files','result?.request_id','player-load','player-play','player-pause','player-seek','player-volume','sleepyNativePlayerState')) {
            if (-not $ui.Contains($needle)) { throw "UI contract missing: $needle" }
          }
          if ($ui.Contains("audio.src='/api/audio/")) { throw 'UI is still using browser/localhost audio playback.' }
          foreach ($needle in @('AudioEngine audioEngine','type=="player-load"','audioEngine.Load','audioEngine.Play','audioEngine.Pause','audioEngine.Seek','audioEngine.SetVolume','PushPlayerStateAsync')) {
            if (-not $form.Contains($needle)) { throw "C# native audio bridge missing: $needle" }
          }
          foreach ($needle in @('MediaFoundationReader','WaveOutEvent','DesiredLatency = 100','NumberOfBuffers = 3')) {
            if (-not $engine.Contains($needle)) { throw "Native AudioEngine contract missing: $needle" }
          }
          if (-not $project.Contains('Include="NAudio" Version="2.3.0"')) { throw 'NAudio 2.3.0 package is missing.' }
          foreach ($needle in @('data.Files.Add(full)','foreach (var file in standalone)','Supported.Contains(Path.GetExtension(file))')) {
            if (-not $library.Contains($needle)) { throw "Standalone file-add contract missing: $needle" }
          }
          if (-not $backend.Contains('public const int Port = 17894;')) { throw 'Backend/UI port contract is not 17894.' }
          if (-not $backend.Contains('GetTrack(string id)')) { throw 'Backend track lookup for native playback is missing.' }

          $match = [regex]::Match($ui, '<script>([\s\S]*?)</script>')
          if (-not $match.Success) { throw 'Could not extract SleepyMusic UI JavaScript.' }
          Set-Content -Path '_sleepymusic_build/ui-smoke.js' -Value $match.Groups[1].Value -Encoding utf8
          node --check '_sleepymusic_build/ui-smoke.js'

      - name: Restore and publish Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore '_sleepymusic_build/CSharpHost/SleepyMusic.csproj' -r win-x64
          dotnet publish '_sleepymusic_build/CSharpHost/SleepyMusic.csproj' -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true --no-restore -o 'sleepymusic-dist'
          if (-not (Test-Path 'sleepymusic-dist/SleepyMusic.exe')) { throw 'SleepyMusic.exe was not produced.' }
          if ((Get-Item 'sleepymusic-dist/SleepyMusic.exe').Length -lt 1000000) { throw 'SleepyMusic.exe is unexpectedly small.' }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path 'sleepymusic-dist/SleepyMusic.exe').Path)
          if ($null -eq $icon) { throw 'SleepyMusic.exe has no embedded application icon.' }
          $icon.Dispose()

      - name: Runtime API smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'http://127.0.0.1:17894'
          $proc = Start-Process -FilePath (Resolve-Path 'sleepymusic-dist/SleepyMusic.exe') -ArgumentList '--headless' -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 50; $i++) {
              if ($proc.HasExited) { throw "SleepyMusic exited before backend ready. Exit: $($proc.ExitCode)" }
              try {
                $health = Invoke-WebRequest "$base/api/health" -TimeoutSec 2 -UseBasicParsing
                if ($health.StatusCode -eq 200 -and $health.Content.Trim() -eq 'ok') { $ready = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 400
            }
            if (-not $ready) { throw 'SleepyMusic backend did not become ready on port 17894.' }
            $status = Invoke-WebRequest "$base/api/status" -UseBasicParsing
            if ($status.Content -notmatch 'SleepyMusic') { throw 'Status endpoint failed.' }
            $library = Invoke-WebRequest "$base/api/library" -UseBasicParsing
            $snapshot = $library.Content | ConvertFrom-Json
            if ($null -eq $snapshot.tracks) { throw 'Library snapshot shape is missing tracks.' }
            $page = Invoke-WebRequest "$base/" -UseBasicParsing
            if ($page.Content -notmatch 'player-load' -or $page.Content -notmatch 'sleepyNativePlayerState') { throw 'Served UI is not the native-audio UI.' }
          }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload compiled SleepyMusic
        uses: actions/upload-artifact@v4
        with:
          name: SleepyMusic-1.0.0-Windows-x64-NativeAudio
          path: sleepymusic-dist/
          if-no-files-found: error
