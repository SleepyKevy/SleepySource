name: Trigger SleepySource CSharp Parity Validation

on:
  push:
    branches:
      - csharp-rewrite-1.0
    paths:
      - .github/workflows/trigger-parity.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch parity workflow on current branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run csharp-go-contract-parity.yml --repo "$GH_REPO" --ref csharp-rewrite-1.0
