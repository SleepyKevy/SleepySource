<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SleepySource Countdown</title>
<style id="customFonts"></style>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}*{box-sizing:border-box}
#canvas{position:relative;overflow:hidden;width:100%;height:100%;background:transparent}
#timer{position:absolute;display:flex;align-items:center;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;font-family:"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;transform:translateZ(0)}
#text{display:block;width:100%}
@keyframes timerFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes timerPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}@keyframes timerBreathe{0%,100%{filter:brightness(1)}50%{filter:brightness(1.13)}}@keyframes timerGlow{0%,100%{filter:drop-shadow(0 0 3px currentColor)}50%{filter:drop-shadow(0 0 13px currentColor)}}@keyframes timerTilt{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}@keyframes panelGlow{0%,100%{box-shadow:0 0 0 rgba(58,167,255,0)}50%{box-shadow:0 0 24px rgba(58,167,255,.35)}}@keyframes panelShimmer{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}
</style>
</head>
<body>
<div id="canvas"><div id="timer"><span id="text">05:00</span></div></div>
<script>
const canvas=document.getElementById('canvas'),timer=document.getElementById('timer'),text=document.getElementById('text'),fontStyle=document.getElementById('customFonts');
let state=null,anchorMS=0,anchorPerf=performance.now(),lastSync=0,lastRendered='',entranceApplied=false;const previewMode=new URLSearchParams(location.search).has('preview');
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
function rgba(hex,opacity){const h=(hex||'#000000').replace('#','');const n=parseInt(h,16)||0;return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${clamp(Number(opacity)||0,0,100)/100})`}
function escCSS(v){return String(v||'').replace(/[\\"\n\r]/g,m=>({'\\':'\\\\','"':'\\"','\n':'','\r':''}[m]||''))}
function installFonts(fonts=[]){fontStyle.textContent=fonts.map(f=>`@font-face{font-family:"${escCSS(f.family)}";src:url("${escCSS(f.url)}") format("${String(f.name||'').toLowerCase().endsWith('.woff2')?'woff2':String(f.name||'').toLowerCase().endsWith('.woff')?'woff':String(f.name||'').toLowerCase().endsWith('.otf')?'opentype':'truetype'}");font-display:swap}`).join('\n')}
function displaySeconds(mode,ms){if(mode==='countdown'){if(ms>0)return Math.floor((ms+999)/1000);if(ms<0)return -Math.floor(((-ms)+999)/1000);return 0}return Math.trunc(ms/1000)}
function customFormat(fmt,seconds){const neg=seconds<0,abs=Math.abs(seconds),days=Math.floor(abs/86400),totalHours=Math.floor(abs/3600),hours=totalHours%24,minutes=Math.floor(abs/60)%60,secs=abs%60,pad=n=>String(n).padStart(2,'0');return String(fmt||'{hh}:{mm}:{ss}').replace(/\{sign\}|\{hh\}|\{mm\}|\{ss\}|\{d\}|\{h\}|\{m\}|\{s\}/g,t=>({"{sign}":neg?'-':'',"{hh}":pad(hours),"{mm}":pad(minutes),"{ss}":pad(secs),"{d}":days,"{h}":hours,"{m}":minutes,"{s}":secs}[t]))}
function formatBody(s,seconds){const neg=seconds<0,abs=Math.abs(seconds),sign=neg?'-':'',days=Math.floor(abs/86400),totalHours=Math.floor(abs/3600),hour=totalHours%24,totalMinutes=Math.floor(abs/60),minutes=totalMinutes%60,secs=abs%60,pad=n=>String(n).padStart(2,'0');if(s.format==='hhmmss')return `${sign}${String(totalHours).padStart(2,'0')}:${pad(minutes)}:${pad(secs)}`;if(s.format==='mmss')return `${sign}${String(totalMinutes).padStart(2,'0')}:${pad(secs)}`;if(s.format==='seconds')return `${sign}${abs}`;if(s.format==='custom')return customFormat(s.custom_format,seconds);if(abs>=86400)return `${sign}${days}:${pad(hour)}:${pad(minutes)}:${pad(secs)}`;if(abs>=3600)return `${sign}${totalHours}:${pad(minutes)}:${pad(secs)}`;return `${sign}${String(totalMinutes).padStart(2,'0')}:${pad(secs)}`}
function localMS(){if(!state)return 0;if(!state.running)return anchorMS;const s=state.settings,elapsed=performance.now()-anchorPerf;let value=s.mode==='countdown'?anchorMS-elapsed:anchorMS+elapsed;if(s.mode==='countdown'&&!s.overtime&&value<=0){const d=Number(state.duration_ms)||0;if(s.loop&&d>0){const over=-value,rem=over%d;value=rem===0?d:d-rem}else value=0}return value}
function renderedText(ms){if(!state)return '';const s=state.settings;if(state.finished){if(s.blank_on_finish)return '';return s.prefix+(s.finished_text||formatBody(s,0))+s.suffix}if(s.mode==='countdown'&&!s.overtime&&ms<=0&&!s.loop){if(s.blank_on_finish)return '';return s.prefix+(s.finished_text||formatBody(s,0))+s.suffix}return s.prefix+formatBody(s,displaySeconds(s.mode,ms))+s.suffix}
function applyStyle(){if(!state)return;const s=state.settings;document.documentElement.style.width=s.canvas_width+'px';document.documentElement.style.height=s.canvas_height+'px';document.body.style.width=s.canvas_width+'px';document.body.style.height=s.canvas_height+'px';canvas.style.width=s.canvas_width+'px';canvas.style.height=s.canvas_height+'px';canvas.style.background=s.canvas_transparent?'transparent':rgba(s.canvas_color,s.canvas_opacity);timer.style.left=s.timer_x+'px';timer.style.top=s.timer_y+'px';timer.style.width=s.timer_width+'px';timer.style.fontFamily=`"${escCSS(s.font_family)}","Segoe UI",sans-serif`;timer.style.fontSize=s.font_size+'px';timer.style.fontWeight=String(s.font_weight);timer.style.color=rgba(s.text_color,s.text_opacity);timer.style.textAlign=s.align;timer.style.letterSpacing=s.letter_spacing+'px';timer.style.lineHeight=String(s.line_height);timer.style.padding=s.panel_enabled?s.panel_padding+'px':'0';timer.style.background=s.panel_enabled?rgba(s.panel_color,s.panel_opacity):'transparent';timer.style.borderRadius=s.panel_enabled?s.panel_radius+'px':'0';timer.style.border=s.panel_enabled&&s.border_width>0?`${s.border_width}px solid ${rgba(s.border_color,s.border_opacity)}`:'none';const outline=s.outline&&s.outline_size>0?`${s.outline_size}px ${rgba(s.outline_color,s.outline_opacity)}`:'0 transparent';timer.style.webkitTextStroke=outline;timer.style.paintOrder='stroke fill';timer.style.textShadow=s.text_shadow?'0 3px 12px rgba(0,0,0,.72)':'none';const ms=Math.max(250,Number(s.animation_ms)||1800),timerMap={float:'timerFloat',pulse:'timerPulse',breathe:'timerBreathe',glow:'timerGlow',tilt:'timerTilt'},panelMap={breathe:'timerBreathe',glow:'panelGlow',shimmer:'panelShimmer',pulse:'timerPulse'},animations=[];if(timerMap[s.timer_animation])animations.push(`${timerMap[s.timer_animation]} ${ms}ms ease-in-out infinite`);if(s.panel_enabled&&panelMap[s.panel_animation])animations.push(`${panelMap[s.panel_animation]} ${Math.max(ms,700)}ms ease-in-out infinite`);timer.style.animation=animations.join(',');if(!entranceApplied){entranceApplied=true;const frames={fade:[{opacity:0},{opacity:1}],'slide-up':[{opacity:0,transform:'translateY(24px)'},{opacity:1,transform:'none'}],zoom:[{opacity:0,transform:'scale(.88)'},{opacity:1,transform:'scale(1)'}]}[s.overlay_animation];if(frames)canvas.animate(frames,{duration:ms,easing:'cubic-bezier(.2,.8,.2,1)'})}}
function tickFrames(name){return({pop:[{transform:'scale(.92)'},{transform:'scale(1.06)'},{transform:'none'}],flip:[{transform:'perspective(500px) rotateX(-55deg)'},{transform:'none'}],slide:[{opacity:.3,transform:'translateY(-8px)'},{opacity:1,transform:'none'}],pulse:[{opacity:.55},{opacity:1}]})[name]||null}
function render(){if(!state)return;const next=renderedText(localMS());if(next!==lastRendered){const frames=tickFrames(state.settings.tick_animation);if(frames)text.animate(frames,{duration:Math.min(650,Math.max(180,Number(state.settings.animation_ms)||400)),easing:'cubic-bezier(.2,.8,.2,1)'});lastRendered=next;text.textContent=next}requestAnimationFrame(render)}
async function syncState(){try{const r=await fetch('/api/countdown/state',{cache:'no-store'});if(!r.ok)return;state=await r.json();anchorMS=Number(state.current_ms)||0;anchorPerf=performance.now();lastSync=Date.now();installFonts(state.fonts||[]);applyStyle()}catch(_){}}
async function announceLoad(){if(previewMode)return;try{await fetch('/api/countdown/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'overlay_loaded'})})}catch(_){}}
function announceUnload(){if(previewMode||!state?.settings?.reset_on_unload)return;try{navigator.sendBeacon('/api/countdown/control',new Blob([JSON.stringify({action:'overlay_unloaded'})],{type:'application/json'}))}catch(_){}}
window.addEventListener('pagehide',announceUnload);
(async()=>{await announceLoad();await syncState();render();setInterval(syncState,1000)})();
</script>
</body>
</html>
