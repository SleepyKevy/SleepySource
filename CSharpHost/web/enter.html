<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SleepySource 1.0</title>
<style>
:root{
  color-scheme:dark;
  --bg:#02050a;
  --text:#f4f8ff;
  --muted:#8294b1;
  --muted2:#60718f;
  --blue:#20a9ff;
  --blue2:#05d7ff;
  --line:rgba(37,163,255,.55);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%}
body{
  margin:0;
  overflow:hidden;
  color:var(--text);
  font-family:"Segoe UI",Inter,system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(ellipse at 50% 28%,rgba(0,77,190,.24) 0%,rgba(0,40,110,.12) 25%,transparent 53%),
    radial-gradient(ellipse at 50% 100%,rgba(0,60,150,.11),transparent 48%),
    linear-gradient(180deg,#01040a 0%,#030812 52%,#01040a 100%);
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(0,157,255,.045),transparent);
  transform:translateX(-115%);
  animation:screenSweep 8s ease-in-out infinite;
}
body::after{
  content:"";
  position:fixed;
  inset:-18%;
  pointer-events:none;
  background:
    radial-gradient(circle at 18% 68%,rgba(0,124,255,.09),transparent 18%),
    radial-gradient(circle at 82% 64%,rgba(0,177,255,.075),transparent 17%),
    radial-gradient(circle at 50% 36%,rgba(0,80,255,.09),transparent 28%);
  filter:blur(24px);
  animation:ambientDrift 12s ease-in-out infinite alternate;
}
.particleField{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:0;
}
.particle{
  position:absolute;
  left:var(--x);
  top:var(--y);
  width:var(--size);
  height:var(--size);
  border-radius:50%;
  background:rgb(56 184 255);
  box-shadow:0 0 calc(var(--size) * 4) rgba(0,137,255,.72);
  opacity:0;
  animation:particleFloat var(--duration) ease-in-out var(--delay) infinite;
}
.buildLabel,.statusLine{
  position:fixed;
  z-index:5;
  color:rgba(170,192,221,.66);
  font-size:clamp(9px,.95vw,12px);
  letter-spacing:.02em;
  user-select:none;
  animation:cornerFade .8s ease .8s both;
}
.buildLabel{right:24px;bottom:20px}
.statusLine{left:24px;bottom:20px;display:flex;align-items:center;gap:8px}
.statusDot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#17b8ff;
  box-shadow:0 0 10px rgba(0,177,255,.88);
  animation:readyPulse 2.2s ease-in-out infinite;
}
.splash{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 28px;
  opacity:1;
  transform:scale(1);
  transition:opacity .2s ease,transform .2s ease;
}
.splash.leaving{opacity:0;transform:scale(.992)}
.content{
  width:min(860px,94vw);
  max-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
}
.logoStage{
  position:relative;
  width:clamp(255px,34vh,430px);
  height:clamp(255px,34vh,430px);
  display:grid;
  place-items:center;
  margin-bottom:clamp(5px,1vh,12px);
  animation:introRise .72s cubic-bezier(.2,.75,.25,1) .06s both;
}
.logoStage::before{
  content:"";
  position:absolute;
  width:130%;
  height:20%;
  left:-15%;
  top:54%;
  border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,143,255,.52) 0%,rgba(0,92,255,.18) 38%,transparent 72%);
  filter:blur(15px);
  opacity:.72;
  animation:flarePulse 4.8s ease-in-out infinite;
}
.logoStage::after{
  content:"";
  position:absolute;
  inset:5%;
  border-radius:50%;
  background:radial-gradient(circle,rgba(0,198,255,.14),rgba(0,91,255,.07) 45%,transparent 69%);
  filter:blur(20px);
  animation:haloPulse 4.8s ease-in-out infinite;
}
.logo{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  object-fit:contain;
  user-select:none;
  -webkit-user-drag:none;
  filter:drop-shadow(0 0 10px rgba(0,198,255,.5)) drop-shadow(0 0 25px rgba(0,84,255,.28));
  animation:logoBreathe 4.8s ease-in-out infinite;
}
.title{
  margin:0;
  font-size:clamp(48px,7.6vh,78px);
  line-height:.96;
  font-weight:800;
  letter-spacing:-.045em;
  color:#f4f7ff;
  text-shadow:0 0 18px rgba(73,149,255,.22),0 2px 0 rgba(255,255,255,.16);
  animation:introRise .62s cubic-bezier(.2,.75,.25,1) .18s both;
}
.version{
  margin-top:clamp(9px,1.3vh,14px);
  color:#a6b9d6;
  font-size:clamp(15px,2vh,21px);
  font-weight:500;
  animation:introRise .6s cubic-bezier(.2,.75,.25,1) .27s both;
}
.tagline{
  margin-top:clamp(13px,2vh,22px);
  color:#e7efff;
  font-size:clamp(18px,2.4vh,26px);
  font-weight:650;
  animation:introRise .6s cubic-bezier(.2,.75,.25,1) .35s both;
}
.features{
  margin-top:clamp(7px,1.15vh,12px);
  color:#8190aa;
  font-size:clamp(14px,1.75vh,19px);
  font-weight:450;
  letter-spacing:.01em;
  animation:introRise .6s cubic-bezier(.2,.75,.25,1) .42s both;
}
.features .dot{color:#159cff;padding:0 .42em;text-shadow:0 0 8px rgba(0,153,255,.75)}
.openButton{
  margin-top:clamp(20px,2.7vh,30px);
  width:min(390px,68vw);
  min-height:56px;
  padding:0 22px;
  border:1px solid rgba(60,194,255,.72);
  border-radius:18px;
  color:#7ed3ff;
  background:linear-gradient(180deg,rgba(7,27,55,.78),rgba(3,14,33,.94));
  font:700 clamp(18px,2.2vh,24px)/1 "Segoe UI",system-ui,sans-serif;
  cursor:pointer;
  box-shadow:0 0 0 1px rgba(92,193,255,.08) inset,0 10px 26px rgba(0,56,110,.20),0 0 18px rgba(0,145,255,.10);
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  backdrop-filter:blur(5px);
  transition:transform .14s ease,background .18s ease,border-color .18s ease,color .18s ease,box-shadow .18s ease;
  animation:introRise .62s cubic-bezier(.2,.75,.25,1) .5s both;
}
.openButton::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  box-shadow:0 0 0 1px rgba(255,255,255,.03) inset,0 0 22px rgba(0,145,255,.12);
  opacity:.7;
  animation:buttonIdleGlow 3.6s ease-in-out 1.3s infinite;
}
.openButton .label{position:relative;z-index:1}
.openButton:hover{
  color:#b5e9ff;
  border-color:#5fd2ff;
  background:linear-gradient(180deg,rgba(9,38,73,.88),rgba(4,18,40,.96));
  box-shadow:0 0 0 1px rgba(100,202,255,.12) inset,0 14px 32px rgba(0,78,151,.25),0 0 24px rgba(0,164,255,.16);
  transform:translateY(-1px);
}
.openButton:active{transform:translateY(1px) scale(.995);box-shadow:0 8px 18px rgba(0,84,160,.18),0 0 16px rgba(0,150,255,.12)}
.openButton:focus-visible{outline:2px solid #9be4ff;outline-offset:4px}
.footer{
  margin-top:clamp(18px,2.5vh,28px);
  color:#7e8da6;
  font-size:clamp(15px,1.9vh,20px);
  font-weight:450;
  animation:introRise .58s cubic-bezier(.2,.75,.25,1) .6s both;
}
.footer .dot{color:#267fff;padding:0 .46em}
@keyframes introRise{from{opacity:0;transform:translateY(13px) scale(.992)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes cornerFade{from{opacity:0}to{opacity:1}}
@keyframes ambientDrift{0%{transform:translate3d(-1.5%,.5%,0) scale(1)}100%{transform:translate3d(1.5%,-1%,0) scale(1.035)}}
@keyframes particleFloat{
0%,100%{opacity:0;transform:translate3d(0,0,0) scale(.72)}
12%{opacity:var(--alpha-low);transform:translate3d(var(--dx1a),var(--dy1a),0) scale(.86)}
28%{opacity:var(--alpha);transform:translate3d(var(--dx1),var(--dy1),0) scale(1)}
52%{opacity:var(--alpha-mid);transform:translate3d(var(--dx2),var(--dy2),0) scale(1.06)}
78%{opacity:var(--alpha-soft);transform:translate3d(var(--dx3),var(--dy3),0) scale(.96)}
92%{opacity:var(--alpha-fade);transform:translate3d(var(--dx2a),var(--dy2a),0) scale(.82)}
}
@keyframes readyPulse{0%,100%{opacity:.65;transform:scale(.9)}50%{opacity:1;transform:scale(1.18)}}
@keyframes buttonIdleGlow{0%,100%{opacity:.28;transform:scale(.995)}50%{opacity:.78;transform:scale(1.012)}}
@keyframes logoBreathe{0%,100%{transform:scale(1);filter:drop-shadow(0 0 10px rgba(0,198,255,.46)) drop-shadow(0 0 24px rgba(0,84,255,.25))}50%{transform:scale(1.012);filter:drop-shadow(0 0 15px rgba(0,211,255,.64)) drop-shadow(0 0 34px rgba(0,99,255,.38))}}
@keyframes haloPulse{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:.94;transform:scale(1.035)}}
@keyframes flarePulse{0%,100%{opacity:.45;transform:scaleX(.88)}50%{opacity:.82;transform:scaleX(1.08)}}
@keyframes screenSweep{0%,70%{transform:translateX(-115%);opacity:0}78%{opacity:1}92%{opacity:.8}100%{transform:translateX(115%);opacity:0}}
@media (max-height:760px){
  .splash{padding:14px 22px}
  .logoStage{width:clamp(210px,30vh,285px);height:clamp(210px,30vh,285px)}
  .title{font-size:clamp(42px,7vh,60px)}
  .openButton{min-height:50px;margin-top:16px}
  .footer{margin-top:15px}
}
@media (max-width:640px){
  .buildLabel{right:14px;bottom:12px}
  .statusLine{left:14px;bottom:12px}
  .splash{padding:16px}
  .content{width:100%}
  .logoStage{width:min(62vw,300px);height:min(62vw,300px)}
  .title{font-size:clamp(40px,13vw,60px)}
  .features{font-size:13px}
  .openButton{width:min(360px,88vw);border-radius:16px;padding:0 18px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}
.tm{display:inline-block;margin-left:.12em;font-size:.36em;line-height:1;vertical-align:super;font-weight:700;color:#b7c7dc;letter-spacing:0;transform:translateY(-.08em)}</style>
</head>
<body>
<div id="particleField" class="particleField" aria-hidden="true"></div>
<div class="buildLabel" aria-label="Build 1.0">Build 1.0</div>
<div class="statusLine" role="status" aria-live="polite"><span class="statusDot" aria-hidden="true"></span><span>Ready</span></div>
<main id="splash" class="splash">
  <section class="content" aria-labelledby="appTitle">
    <div class="logoStage" aria-hidden="true">
      <img class="logo" src="/assets/default.png" alt="" draggable="false">
    </div>

    <h1 id="appTitle" class="title">SleepySource<span class="tm" aria-label="trademark">™</span></h1>
    <div class="tagline">Streaming Tools, All in One Place</div>
    <div class="features">Now Playing <span class="dot">•</span> Chat Overlay <span class="dot">•</span> Countdown Pro <span class="dot">•</span> Kick Integration</div>

    <button id="openSleepySource" class="openButton" type="button" autofocus>
      <span class="label">Open SleepySource</span>
    </button>

    <div class="footer">Made by SleepyKev <span class="dot">•</span> 2026</div>
  </section>
</main>
<script>
(() => {
  const splash = document.getElementById('splash');
  const button = document.getElementById('openSleepySource');
  const particleField = document.getElementById('particleField');
  let opening = false;

  function buildParticles() {
    if (!particleField || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    particleField.textContent = '';
    const count = Math.min(32, Math.max(18, Math.round(window.innerWidth / 68)));
    for (let i = 0; i < count; i++) {
      const particle = document.createElement('span');
      particle.className = 'particle';
      const size = 1 + Math.random() * 2.8;
      particle.style.setProperty('--x', `${2 + Math.random() * 96}%`);
      particle.style.setProperty('--y', `${6 + Math.random() * 88}%`);
      particle.style.setProperty('--size', `${size.toFixed(2)}px`);
      const alpha = 0.12 + Math.random() * 0.24;
      const dx1 = -28 + Math.random() * 56;
      const dy1 = -28 + Math.random() * 56;
      const dx2 = -28 + Math.random() * 56;
      const dy2 = -28 + Math.random() * 56;
      const dx3 = -28 + Math.random() * 56;
      const dy3 = -28 + Math.random() * 56;
      particle.style.setProperty('--alpha', alpha.toFixed(2));
      particle.style.setProperty('--alpha-low', (alpha * 0.55).toFixed(2));
      particle.style.setProperty('--alpha-mid', (alpha * 0.92).toFixed(2));
      particle.style.setProperty('--alpha-soft', (alpha * 0.84).toFixed(2));
      particle.style.setProperty('--alpha-fade', (alpha * 0.48).toFixed(2));
      particle.style.setProperty('--duration', `${(8.5 + Math.random() * 10).toFixed(2)}s`);
      particle.style.setProperty('--delay', `${(-Math.random() * 14).toFixed(2)}s`);
      particle.style.setProperty('--dx1', `${dx1.toFixed(1)}px`);
      particle.style.setProperty('--dy1', `${dy1.toFixed(1)}px`);
      particle.style.setProperty('--dx1a', `${(dx1 * 0.35).toFixed(1)}px`);
      particle.style.setProperty('--dy1a', `${(dy1 * 0.35).toFixed(1)}px`);
      particle.style.setProperty('--dx2', `${dx2.toFixed(1)}px`);
      particle.style.setProperty('--dy2', `${dy2.toFixed(1)}px`);
      particle.style.setProperty('--dx2a', `${(dx2 * 0.45).toFixed(1)}px`);
      particle.style.setProperty('--dy2a', `${(dy2 * 0.45).toFixed(1)}px`);
      particle.style.setProperty('--dx3', `${dx3.toFixed(1)}px`);
      particle.style.setProperty('--dy3', `${dy3.toFixed(1)}px`);
      particleField.appendChild(particle);
    }
  }

  buildParticles();
  window.addEventListener('resize', () => {
    window.clearTimeout(window.__sleepyParticleResizeTimer);
    window.__sleepyParticleResizeTimer = window.setTimeout(buildParticles, 120);
  });

  function openSleepySource() {
    if (opening) return;
    opening = true;
    button.disabled = true;
    splash.classList.add('leaving');
    window.setTimeout(() => window.location.assign('/designer'), 180);
  }

  button.addEventListener('click', openSleepySource);
  window.addEventListener('keydown', event => {
    if (event.key !== 'Enter' || event.repeat) return;
    event.preventDefault();
    openSleepySource();
  });
})();
</script>
</body>
</html>
