<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SleepySource Overlay</title>
<style>
html,body{margin:0;padding:0;background:transparent!important;overflow:hidden;width:100%;height:100%}
#root{position:relative;overflow:hidden;background:transparent;opacity:0;transition:opacity .28s cubic-bezier(.2,.8,.2,1)}
#backgroundWrap{position:absolute;inset:0;overflow:hidden;pointer-events:none;background:transparent;transform:translateZ(0)}
#backgroundImage,#backgroundVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;opacity:0;transform-origin:center center;backface-visibility:hidden;will-change:opacity,transform,filter;pointer-events:none}#backgroundVideo{background:transparent}
#artWrap{position:absolute;overflow:hidden;transform:translateZ(0);will-change:left,top,width,height,opacity;transition:left .16s ease,top .16s ease,width .16s ease,height .16s ease,opacity .24s cubic-bezier(.2,.8,.2,1),border-radius .18s ease,box-shadow .18s ease}
#artImage,#artVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;image-rendering:auto;opacity:0;transition:opacity .3s cubic-bezier(.2,.8,.2,1),transform .18s ease,filter .18s ease;transform-origin:center center;backface-visibility:hidden;will-change:opacity,transform,filter;pointer-events:none}
#artVideo{background:transparent}
#txt{position:absolute;word-break:break-word;white-space:normal;will-change:left,top,opacity;transition:left .16s ease,top .16s ease,width .16s ease,opacity .22s ease}
#progress{position:absolute;overflow:hidden;contain:layout paint style;transform:translateZ(0);will-change:left,top,width,height,opacity;transition:left .16s ease,top .16s ease,width .16s ease,height .16s ease,opacity .22s ease;pointer-events:none}
#progressFill{position:absolute;inset:0;transform-origin:left center;transform:translate3d(0,0,0) scaleX(0);will-change:transform;backface-visibility:hidden}
#progressEdge{position:absolute;top:0;bottom:0;width:4px;right:-2px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.20),rgba(255,255,255,0));opacity:.45;pointer-events:none}
#remaining{position:absolute;white-space:nowrap;text-align:right;will-change:left,top,opacity;transition:left .16s ease,top .16s ease,opacity .22s ease}
@keyframes ssFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes ssPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}@keyframes ssBreathe{0%,100%{filter:brightness(1)}50%{filter:brightness(1.13)}}@keyframes ssTilt{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}@keyframes ssRotate{to{transform:rotate(360deg)}}@keyframes ssShimmer{0%,100%{filter:brightness(1)}50%{filter:brightness(1.4)}}@keyframes ssBgZoom{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}@keyframes ssPanLeft{0%,100%{transform:translateX(0)}50%{transform:translateX(-2.5%)}}@keyframes ssPanRight{0%,100%{transform:translateX(0)}50%{transform:translateX(2.5%)}}
</style>
</head>
<body>
<div id="root">
  <div id="backgroundWrap"><img id="backgroundImage" alt=""><video id="backgroundVideo" autoplay muted loop playsinline preload="auto"></video></div>
  <div id="artWrap"><img id="artImage" alt=""><video id="artVideo" autoplay muted loop playsinline preload="auto"></video></div>
  <div id="txt"></div>
  <div id="progress"><div id="progressFill"><div id="progressEdge"></div></div></div>
  <div id="remaining"></div>
</div>
<script>
let state=null,lastMediaURL='',lastMediaKind='',lastBackgroundURL='',lastBackgroundKind='',lastSettingsJSON='',lastDisplayText='',fontListSignature='',lastTransitionTrackKey='';
const loadedCustomFonts=new Map();
let progressAnchor={key:'',status:'stopped',duration:0,position:0,perf:performance.now()};
let progressAnimation=null,lastProgressSignature='',lastTimeSignature='';
let metricFrames=0,metricStart=performance.now(),metricLastFrame=metricStart,metricFrameTotal=0;
const runningInsideOBS=!!window.obsstudio||/OBS/i.test(navigator.userAgent||'');
const $=id=>document.getElementById(id);
function clamp(n,min,max){return Math.min(max,Math.max(min,n))}
function trackKey(t){return [t?.artist||'',t?.title||'',t?.source||''].join('\u0001')}
function reportedPosition(t){
  if(!t)return 0;
  let p=Number(t.position_ms||0),d=Number(t.duration_ms||0);
  if(String(t.status||'').toLowerCase()==='playing'&&t.sampled_at_ms)p+=Math.max(0,Date.now()-Number(t.sampled_at_ms));
  return d>0?clamp(p,0,d):Math.max(0,p);
}
function anchorPosition(now=performance.now()){
  const a=progressAnchor;let p=a.position;
  if(a.status==='playing')p+=Math.max(0,now-a.perf);
  return a.duration>0?clamp(p,0,a.duration):Math.max(0,p);
}
function syncProgressAnchor(t){
  const now=performance.now(),desired=reportedPosition(t),key=trackKey(t),status=String(t?.status||'stopped').toLowerCase(),duration=Number(t?.duration_ms||0),current=anchorPosition(now);
  const first=!progressAnchor.key&&!!key,trackChanged=key!==progressAnchor.key,statusChanged=status!==progressAnchor.status;
  const durationBecameAvailable=progressAnchor.duration<=0&&duration>0,majorDurationChange=progressAnchor.duration>0&&duration>0&&Math.abs(duration-progressAnchor.duration)>5000;
  const realSeek=Math.abs(desired-current)>3000;
  if(first||trackChanged||statusChanged||durationBecameAvailable||majorDurationChange||realSeek){
    progressAnchor={key,status,duration,position:desired,perf:now};lastTimeSignature='';return true;
  }
  return false;
}
function formatTime(ms){const total=Math.max(0,Math.floor(ms/1000)),m=Math.floor(total/60),s=total%60;return m+':'+String(s).padStart(2,'0')}
function progressFraction(pos,d,c){const elapsed=d>0?clamp(pos/d,0,1):0;return c.progress_mode==='remaining'?1-elapsed:elapsed}
function setFillFraction(frac){const f=clamp(frac,0,1),fill=$('progressFill');if((state?.settings?.progress_style||'rounded')==='segmented'){fill.style.transform='none';fill.style.clipPath='inset(0 '+((1-f)*100)+'% 0 0)'}else{fill.style.clipPath='none';fill.style.transform='translate3d(0,0,0) scaleX('+f+')'}}
function stopProgressAnimation(){if(progressAnimation){try{progressAnimation.cancel()}catch(e){}progressAnimation=null}}
function restartProgressAnimation(){
  if(!state)return;
  const c=state.settings,t=state.track||{},bar=$('progress'),remaining=$('remaining'),fill=$('progressFill');
  const d=Number(progressAnchor.duration||t.duration_ms||0),showBar=!!c.show_progress&&d>0,showTime=!!c.show_remaining_time&&d>0;
  stopProgressAnimation();
  bar.style.display=showBar?'block':'none';remaining.style.display=showTime?'block':'none';
  if(!showBar){updateTimeText();return}
  const pos=clamp(anchorPosition(),0,d),from=progressFraction(pos,d,c),target=c.progress_mode==='remaining'?0:1;
  setFillFraction(from);
  if(progressAnchor.status==='playing'&&pos<d){
    const remainingMS=Math.max(1,d-pos);
    const frames=(c.progress_style==='segmented')?[{clipPath:'inset(0 '+((1-from)*100)+'% 0 0)'},{clipPath:'inset(0 '+((1-target)*100)+'% 0 0)'}]:[{transform:'translate3d(0,0,0) scaleX('+from+')'},{transform:'translate3d(0,0,0) scaleX('+target+')'}];
    progressAnimation=fill.animate(frames,{duration:remainingMS,easing:'linear',fill:'forwards'});
  }
  updateTimeText();
}
function updateTimeText(){
  if(!state)return;
  const c=state.settings,t=state.track||{},remaining=$('remaining'),d=Number(progressAnchor.duration||t.duration_ms||0);
  if(!c.show_remaining_time||d<=0){remaining.style.display='none';return}
  remaining.style.display='block';
  const pos=clamp(anchorPosition(),0,d),elapsedSec=Math.max(0,Math.floor(pos/1000)),totalSec=Math.max(0,Math.floor(d/1000));
  const signature=elapsedSec+'/'+totalSec;
  if(signature!==lastTimeSignature){lastTimeSignature=signature;remaining.textContent=formatTime(elapsedSec*1000)+'/'+formatTime(totalSec*1000)}
}
function showMedia(url,kind){
  if(url===lastMediaURL&&kind===lastMediaKind)return;
  lastMediaURL=url;lastMediaKind=kind;
  const img=$('artImage'),vid=$('artVideo');
  if(kind==='video'){
    img.style.opacity='0';vid.style.opacity='0';
    if(vid.dataset.src!==url){vid.dataset.src=url;vid.src=url;vid.load()}
    const reveal=()=>{vid.style.opacity='1';vid.play().catch(()=>{})};
    if(vid.readyState>=2)requestAnimationFrame(reveal);else vid.oncanplay=()=>requestAnimationFrame(reveal);
  }else{
    vid.style.opacity='0';vid.pause();img.style.opacity='0';
    if(img.dataset.src!==url){img.dataset.src=url;img.src=url}
    const reveal=()=>requestAnimationFrame(()=>img.style.opacity='1');
    if(img.complete)reveal();else img.onload=reveal;
  }
}
function showBackground(url,kind){
  if(url===lastBackgroundURL&&kind===lastBackgroundKind)return;
  lastBackgroundURL=url;lastBackgroundKind=kind;
  const img=$('backgroundImage'),vid=$('backgroundVideo');
  if(!url){img.style.opacity='0';vid.style.opacity='0';vid.pause();return}
  if(kind==='video'){
    img.style.opacity='0';vid.style.opacity='0';
    if(vid.dataset.src!==url){vid.dataset.src=url;vid.src=url;vid.load()}
    const reveal=()=>{vid.style.opacity='1';vid.play().catch(()=>{})};
    if(vid.readyState>=2)requestAnimationFrame(reveal);else vid.oncanplay=()=>requestAnimationFrame(reveal);
  }else{
    vid.style.opacity='0';vid.pause();img.style.opacity='0';
    if(img.dataset.src!==url){img.dataset.src=url;img.src=url}
    const reveal=()=>requestAnimationFrame(()=>img.style.opacity='1');
    if(img.complete)reveal();else img.onload=reveal;
  }
}
function syncFonts(fonts=[]){
  const sig=JSON.stringify(fonts.map(f=>[f.id,f.family,f.url]));if(sig===fontListSignature)return;fontListSignature=sig;
  for(const f of fonts){
    if(!f?.family||!f?.url)continue;
    const previous=loadedCustomFonts.get(f.family);if(previous?.url===f.url&&previous?.status==='ready')continue;
    if(previous?.face){try{document.fonts.delete(previous.face)}catch(e){}}
    const record={url:f.url,status:'loading',face:null};loadedCustomFonts.set(f.family,record);
    const face=new FontFace(f.family,'url("'+f.url.replaceAll('"','%22')+'")');record.face=face;
    face.load().then(loaded=>{document.fonts.add(loaded);record.status='ready'}).catch(()=>record.status='error');
  }
}
function transitionEasing(c){const e=c.transition_easing||'smooth';if(e==='snappy')return'cubic-bezier(.16,1,.3,1)';if(e==='spring')return'cubic-bezier(.22,1.35,.36,1)';if(['linear','ease','ease-in','ease-out','ease-in-out'].includes(e))return e;return'cubic-bezier(.2,.8,.2,1)'}
function runSongTransition(c,t){
  const key=trackKey(t);if(!key||!lastTransitionTrackKey){lastTransitionTrackKey=key;return}if(key===lastTransitionTrackKey)return;lastTransitionTrackKey=key;
  const style=c.transition_style||'fade',ms=Math.max(0,Number(c.transition_ms||300));if(style==='none'||ms<=0)return;
  let from={opacity:0},to={opacity:1};
  if(style==='slide-left'){from={opacity:0,transform:'translateX(32px)'};to={opacity:1,transform:'translateX(0)'}}
  else if(style==='slide-right'){from={opacity:0,transform:'translateX(-32px)'};to={opacity:1,transform:'translateX(0)'}}
  else if(style==='slide-up'){from={opacity:0,transform:'translateY(24px)'};to={opacity:1,transform:'translateY(0)'}}
  else if(style==='slide-down'){from={opacity:0,transform:'translateY(-24px)'};to={opacity:1,transform:'translateY(0)'}}
  else if(style==='scale'||style==='zoom-in'){from={opacity:0,transform:'scale(.9)'};to={opacity:1,transform:'scale(1)'}}
  else if(style==='zoom-out'){from={opacity:0,transform:'scale(1.1)'};to={opacity:1,transform:'scale(1)'}}
  else if(style==='blur'){from={opacity:0,filter:'blur(10px)'};to={opacity:1,filter:'blur(0px)'}}
  else if(style==='flip'){from={opacity:0,transform:'perspective(700px) rotateY(-70deg) scale(.96)'};to={opacity:1,transform:'perspective(700px) rotateY(0deg) scale(1)'}}
  const easing=transitionEasing(c);for(const el of [$('artWrap'),$('txt'),$('progress'),$('remaining')]){try{el.animate([from,to],{duration:ms,easing,fill:'none'})}catch(e){}}
}
function motionCSS(name,ms){const map={float:'ssFloat',pulse:'ssPulse',breathe:'ssBreathe',tilt:'ssTilt','slow-rotate':'ssRotate',shimmer:'ssShimmer'};return map[name]?`${map[name]} ${Math.max(800,Number(ms)||5000)}ms ease-in-out infinite`:''}
function backgroundMotionCSS(name,ms){const map={'slow-zoom':'ssBgZoom','pan-left':'ssPanLeft','pan-right':'ssPanRight'};return map[name]?`${map[name]} ${Math.max(1600,Number(ms)||6000)}ms ease-in-out infinite`:''}
function textEffectCSS(effect,color,shadowOn){let shadow=shadowOn?'0 3px 12px rgba(0,0,0,.9)':'none',stroke='0 transparent';if(effect==='soft-glow')shadow=`0 0 12px ${color},0 3px 12px rgba(0,0,0,.75)`;if(effect==='neon')shadow=`0 0 5px ${color},0 0 14px ${color},0 0 26px ${color}`;if(effect==='outline')stroke=`1px ${color}`;return{shadow,stroke}}
function applySettings(c){
  const root=$('root'),bg=$('backgroundWrap'),wrap=$('artWrap'),txt=$('txt'),bar=$('progress'),remaining=$('remaining'),fill=$('progressFill');
  root.style.width=c.canvas_width+'px';root.style.height=c.canvas_height+'px';root.style.borderRadius=(c.background_radius||0)+'px';root.style.animation=motionCSS(c.overlay_animation,c.overlay_animation_ms);bg.style.animation=backgroundMotionCSS(c.background_motion,c.overlay_animation_ms);
  const bgMode=c.background_mode||'transparent';bg.style.display=bgMode==='transparent'?'none':'block';bg.style.opacity=(c.background_opacity/100);bg.style.backgroundColor=bgMode==='solid'?(c.background_color||'#000000'):'transparent';
  const bgStyle={objectFit:c.background_fit||'cover',objectPosition:(c.background_position_x??50)+'% '+(c.background_position_y??50)+'%',transform:'scale('+((c.background_zoom||100)/100)+') translateZ(0)',filter:'brightness('+((c.background_brightness||100)/100)+') contrast('+((c.background_contrast||100)/100)+') saturate('+((c.background_saturation||100)/100)+') blur('+(c.background_blur||0)+'px)'};Object.assign($('backgroundImage').style,bgStyle);Object.assign($('backgroundVideo').style,bgStyle);
  const artShadows=[];if(c.media_shadow)artShadows.push('0 10px 28px rgba(0,0,0,.38)');if(c.media_glow&&c.media_glow_size>0)artShadows.push('0 0 '+c.media_glow_size+'px '+(c.media_glow_color||'#3AA7FF'));
  Object.assign(wrap.style,{left:c.image_x+'px',top:c.image_y+'px',width:c.image_width+'px',height:c.image_height+'px',opacity:(c.image_opacity/100),borderRadius:c.media_radius+'px',border:(c.media_border_width||0)+'px solid '+(c.media_border_color||'#3AA7FF'),boxShadow:artShadows.join(',')||'none',animation:motionCSS(c.artwork_animation,c.artwork_animation_ms)});
  const mediaStyle={objectFit:c.media_fit||'cover',objectPosition:(c.media_position_x??50)+'% '+(c.media_position_y??50)+'%',transform:'scale('+((c.media_zoom||100)/100)+') translateZ(0)',filter:'brightness('+((c.media_brightness||100)/100)+') contrast('+((c.media_contrast||100)/100)+') saturate('+((c.media_saturation||100)/100)+')'};Object.assign($('artImage').style,mediaStyle);Object.assign($('artVideo').style,mediaStyle);
  const textFx=textEffectCSS(c.text_effect,c.text_color,c.text_shadow);Object.assign(txt.style,{left:c.text_x+'px',top:c.text_y+'px',width:c.text_width+'px',fontFamily:c.text_font,fontSize:c.text_size+'px',fontWeight:c.text_weight,color:c.text_color,textAlign:c.text_align,lineHeight:c.text_line_height,textShadow:textFx.shadow,webkitTextStroke:textFx.stroke,animation:motionCSS(c.text_animation,c.overlay_animation_ms)});
  const ps=c.progress_style||'rounded',pr=ps==='square'?0:ps==='pill'?Math.max(0,c.progress_height/2):c.progress_radius;const track=c.progress_track_color||'#26384F',fillColor=c.progress_color||'#3AA7FF';
  Object.assign(bar.style,{left:c.progress_x+'px',top:c.progress_y+'px',width:c.progress_width+'px',height:c.progress_height+'px',background:ps==='segmented'?('repeating-linear-gradient(90deg,'+track+' 0 18px,transparent 18px 22px)'):track,borderRadius:pr+'px',filter:ps==='glow'?('drop-shadow(0 0 6px '+fillColor+')'):'none'});
  Object.assign(fill.style,{background:ps==='segmented'?('repeating-linear-gradient(90deg,'+fillColor+' 0 18px,transparent 18px 22px)'):ps==='gradient'?('linear-gradient(90deg,'+fillColor+',#8D7CFF)'):fillColor,borderRadius:pr+'px'});
  Object.assign(remaining.style,{left:c.time_x+'px',top:c.time_y+'px',width:c.time_width+'px',color:c.progress_text_color,fontFamily:c.text_font,fontSize:c.progress_text_size+'px',fontWeight:'600',textAlign:c.time_align||'right',textShadow:c.text_shadow?'0 2px 8px rgba(0,0,0,.85)':'none'});
}
function apply(s){
  state=s;syncFonts(s.fonts||[]);
  const c=s.settings,t=s.track||{},root=$('root');
  const settingsJSON=JSON.stringify(c),settingsChanged=settingsJSON!==lastSettingsJSON;
  if(settingsChanged){lastSettingsJSON=settingsJSON;applySettings(c)}
  const opacity=s.visible?'1':'0';if(root.style.opacity!==opacity)root.style.opacity=opacity;
  if((c.background_mode||'transparent')==='custom')showBackground(s.background_url||'',s.background_kind||'image');else showBackground('','image');
  showMedia(s.image_url,s.media_kind||'image');
  if(s.display_text!==lastDisplayText){lastDisplayText=s.display_text||'';$('txt').textContent=lastDisplayText}
  runSongTransition(c,t);
  const anchorChanged=syncProgressAnchor(t);
  const progressSignature=[c.show_progress,c.show_remaining_time,c.progress_mode,c.progress_width,c.progress_height,c.progress_color,c.progress_track_color,c.progress_radius,c.progress_style].join('|');
  const progressSettingsChanged=progressSignature!==lastProgressSignature;
  if(progressSettingsChanged)lastProgressSignature=progressSignature;
  if(anchorChanged||progressSettingsChanged)restartProgressAnimation();
  else updateTimeText();
}
async function update(){try{const r=await fetch('/api/state',{cache:'no-store'});if(r.ok)apply(await r.json())}catch(e){}}
async function sendMetrics(fps,frameMS){if(!runningInsideOBS)return;try{await fetch('/api/overlay-metrics',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fps,frame_ms:frameMS}),keepalive:true})}catch(e){}}
function monitorFrames(now){
  metricFrames++;
  if(metricFrames>1)metricFrameTotal+=Math.max(0,now-metricLastFrame);
  metricLastFrame=now;
  const span=now-metricStart;
  if(span>=2000){
    const fps=metricFrames*1000/span,frameMS=metricFrames>1?metricFrameTotal/(metricFrames-1):0;
    sendMetrics(Math.round(fps*10)/10,Math.round(frameMS*10)/10);
    metricFrames=0;metricFrameTotal=0;metricStart=now;
  }
  requestAnimationFrame(monitorFrames);
}
update();
setInterval(update,1000);
setInterval(updateTimeText,100);
requestAnimationFrame(monitorFrames);
</script>
</body>
</html>
